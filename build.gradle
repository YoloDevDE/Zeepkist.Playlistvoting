plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.axion.release)
}

group = 'app.yolobolo.zeepkist'
version = scmVersion.version

scmVersion {
    tag {
        prefix = 'v'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.data.mongodb
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.security.oauth2.client
    implementation libs.spring.boot.starter.thymeleaf
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.websocket
    implementation libs.spring.boot.starter.actuator
    implementation libs.thymeleaf.extras.springsecurity6
    implementation libs.springdoc.openapi

    compileOnly libs.lombok
    developmentOnly libs.spring.boot.devtools
    annotationProcessor libs.spring.boot.configuration.processor
    annotationProcessor libs.lombok

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    // Attach Mockito as a Java agent (required for the inline mock maker on the current JDK).
    jvmArgs("-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }.absolutePath}")
}

