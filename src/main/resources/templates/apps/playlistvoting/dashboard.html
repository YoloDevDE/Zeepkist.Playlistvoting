<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Playlist Voting - Dashboard')}"></head>
<body th:replace="~{layout/main-layout :: layout('Dashboard', ~{:: .content-slot}, ~{:: .extra-slot})}">

<div class="content-slot w-full max-w-6xl mx-auto py-8">
    <!-- Header with Live-Update Switch -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
            <h1 class="text-4xl font-black tracking-tight flex items-center gap-3">
                <span class="p-2 bg-brand-accent/10 rounded-lg">
                    <svg class="h-8 w-8 text-brand-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                              stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                </span>
                Dashboard
            </h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 bg-brand-card border border-slate-800 px-4 py-2 rounded-xl shadow-sm">
                <span class="text-sm font-bold uppercase tracking-wider text-brand-muted">Live Update</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input class="sr-only peer" id="liveUpdateToggle" type="checkbox">
                    <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-accent"></div>
                </label>
            </div>
            <button class="px-6 py-3 bg-brand-accent text-brand-dark hover:scale-105 rounded-xl font-black text-sm transition-all shadow-lg shadow-brand-accent/10 flex items-center gap-2"
                    id="newSessionBtn">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                NEW SESSION
            </button>
        </div>
    </div>

    <!-- Active Level Status -->
    <div class="mb-10" id="activeLevelPanel">
        <!-- Will be populated by JS -->
        <div class="bg-brand-card border border-slate-800 rounded-2xl p-8 shadow-xl animate-pulse">
            <div class="h-8 bg-slate-800 rounded w-1/4 mb-4"></div>
            <div class="h-4 bg-slate-800 rounded w-1/2"></div>
        </div>
    </div>

    <!-- Sessions List -->
    <div>
        <h3 class="text-2xl font-black mb-6 flex items-center gap-2">
            All Sessions
            <span class="text-sm font-normal text-brand-muted bg-slate-800 px-2 py-0.5 rounded-md"
                  id="sessionCount">0</span>
        </h3>
        <div class="space-y-4" id="sessionsContainer">
            <!-- Will be populated by JS -->
        </div>
    </div>
</div>

<div class="extra-slot">
    <!-- New Session Modal -->
    <div aria-labelledby="modal-title" aria-modal="true" class="hidden fixed inset-0 z-[60] overflow-y-auto"
         id="newSessionModal" role="dialog">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div aria-hidden="true" class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm transition-opacity"
                 id="modalBackdrop"></div>
            <span aria-hidden="true" class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-brand-card border border-slate-800 rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="p-8">
                    <h3 class="text-2xl font-black mb-6" id="modal-title">New Session</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Display
                                Name</label>
                            <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent/30 transition-all" id="newSessionName" placeholder="My Awesome Stream" required
                                   type="text">
                        </div>
                    </div>
                    <div class="mt-8 flex gap-3">
                        <button class="flex-1 px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all border border-slate-700" id="cancelModalBtn"
                                type="button">
                            Cancel
                        </button>
                        <button class="flex-1 px-4 py-3 bg-brand-accent text-brand-dark hover:bg-brand-accent/80 rounded-xl font-bold transition-all shadow-lg shadow-brand-accent/20" id="submitCreateSessionBtn"
                                type="button">
                            Create
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        const expandedSessions = new Set();
        const expandedLevels = new Set();
        let isLiveUpdateEnabled = false;
        let refreshInterval = null;

        // --- Initialization ---
        $(document).ready(function() {
            console.log('Dashboard initialized with jQuery');

            $('#newSessionBtn').on('click', function() {
                console.log('Opening modal via jQuery listener');
                openModal();
            });

            $('#cancelModalBtn, #modalBackdrop').on('click', closeModal);

            $('#liveUpdateToggle').on('change', function() {
                isLiveUpdateEnabled = $(this).is(':checked');
                if (isLiveUpdateEnabled) startPolling();
                else stopPolling();
            });

            $('#submitCreateSessionBtn').on('click', createNewSession);

            // Global delegate for dynamic elements
            $(document).on('click', '[data-session-toggle]', function() {
                toggleSession($(this).data('session-toggle'));
            });

            $(document).on('click', '[data-level-toggle]', function() {
                toggleLevel($(this).data('level-toggle'));
            });

            // Initial load
            fetchDashboardData();
        });

        function openModal() {
            $('#newSessionModal').removeClass('hidden');
            $('#newSessionName').val('').focus();
        }

        function closeModal() {
            $('#newSessionModal').addClass('hidden');
        }

        function startPolling() {
            if (refreshInterval) clearInterval(refreshInterval);
            fetchDashboardData();
            refreshInterval = setInterval(fetchDashboardData, 3000);
        }

        function stopPolling() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function fetchDashboardData() {
            console.log('Fetching dashboard data...');
            $.ajax({
                url: '/api/playlistvoting/dashboard/live',
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    console.log('Dashboard data received:', data);
                    renderDashboard(data);
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        console.warn('Unauthorized, redirecting to login');
                        window.location.href = '/login';
                    } else {
                        console.error('Failed to fetch dashboard data:', xhr.status, xhr.responseText);
                        showError('Failed to fetch dashboard data (Status: ' + xhr.status + ')');
                    }
                }
            });
        }

        function showError(message) {
            $('#sessionsContainer').html(`
                <div class="bg-red-500/10 border border-red-500/50 rounded-2xl p-8 text-center">
                    <h4 class="text-red-500 font-bold mb-2">Error</h4>
                    <p class="text-slate-400 text-sm">${message}</p>
                    <button id="retryBtn" class="mt-4 px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold">Retry</button>
                </div>
            `);
            $('#retryBtn').on('click', fetchDashboardData);
        }

        function renderDashboard(data) {
            renderActiveLevel(data.currentLevel, data.currentVotes);
            renderSessions(data.sessions);
        }

        function renderActiveLevel(level, votes) {
            const $panel = $('#activeLevelPanel');
            if (!$panel.length) return;

            if (!level) {
                $panel.html(`
                    <div class="bg-brand-card border border-slate-800 rounded-2xl p-8 shadow-xl text-center">
                        <p class="text-brand-muted font-bold uppercase tracking-widest text-xs mb-2">Active Level</p>
                        <h2 class="text-2xl font-black text-slate-500">NO ACTIVE LEVEL</h2>
                        <p class="text-slate-600 text-xs mt-2 italic">Start a vote in Zeepkist to see it here</p>
                    </div>
                `);
                return;
            }

            const voteHtml = votes ? `
                <div class="flex gap-8 mt-6">
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-green-400 uppercase tracking-tighter mb-1">YES</p>
                        <p class="text-3xl font-black">${votes.yes}</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-red-400 uppercase tracking-tighter mb-1">NO</p>
                        <p class="text-3xl font-black">${votes.no}</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter mb-1">ABSTAIN</p>
                        <p class="text-3xl font-black">${votes.abstain}</p>
                    </div>
                    <div class="ml-auto text-right">
                        <p class="text-[10px] font-bold text-brand-accent uppercase tracking-tighter mb-1">Result</p>
                        <p class="text-3xl font-black text-brand-accent">${votes.yesPct}% YES</p>
                    </div>
                </div>
            ` : '';

            $panel.html(`
                <div class="bg-brand-card border-2 border-brand-accent/30 rounded-2xl p-8 shadow-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                        <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <p class="text-brand-accent font-bold uppercase tracking-widest text-xs mb-2 flex items-center gap-2">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-accent"></span>
                        </span>
                        Active Level
                    </p>
                    <h2 class="text-4xl font-black mb-1 truncate">${level.name}</h2>
                    <p class="text-brand-muted font-bold text-lg">by ${level.author}</p>
                    ${voteHtml}
                </div>
            `);
        }

        function renderSessions(sessions) {
            $('#sessionCount').text(sessions.length);
            const $container = $('#sessionsContainer');

            if (sessions.length === 0) {
                $container.html(`
                    <div class="bg-brand-card/30 border-2 border-dashed border-slate-800 rounded-3xl p-12 text-center">
                        <div class="inline-flex p-4 bg-slate-800/50 rounded-2xl mb-4">
                            <svg class="h-10 w-10 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h10a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                            </svg>
                        </div>
                        <h4 class="text-xl font-black mb-3">No sessions found</h4>
                        <p class="text-brand-muted text-sm max-w-sm mx-auto leading-relaxed">
                            There is no session. Please start a vote ingame or create a session here and resume it in game.
                        </p>
                    </div>
                `);
                return;
            }

            const html = sessions.map(session => {
                const isExpanded = expandedSessions.has(session.id);
                const isActive = session.state === 'ACTIVE';

                return `
                    <div class="bg-brand-card border ${isActive ? 'border-brand-accent/50 shadow-brand-accent/5' : 'border-slate-800'} rounded-2xl overflow-hidden transition-all shadow-lg">
                        <div class="p-6 flex items-center justify-between">
                            <div class="flex-1 cursor-pointer" data-session-toggle="${session.id}">
                                <div class="flex items-center gap-3 mb-1">
                                    <h4 class="text-xl font-black">${session.name}</h4>
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${isActive ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                                        ${session.state}
                                    </span>
                                </div>
                                <p class="text-xs text-brand-muted font-bold uppercase tracking-tighter">
                                    ${session.levels.length} Levels • Created on ${new Date(session.createdAt).toLocaleDateString()}
                                </p>
                            </div>
                            
                            <div class="flex items-center gap-3">
                                <a href="/api/playlistvoting/session/${session.id}/playlist/download" 
                                   class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition-all border border-slate-700 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    DOWNLOAD .ZEEPLIST
                                </a>
                                
                                <div class="flex bg-slate-900/50 rounded-xl p-1 border border-slate-800">
                                    <button onclick="updateState('${session.id}', '${isActive ? 'PAUSED' : 'ACTIVE'}')" 
                                            class="p-2 hover:bg-slate-800 rounded-lg transition-colors ${isActive ? 'text-yellow-500' : 'text-green-500'}"
                                            title="${isActive ? 'Pause' : 'Start'}">
                                        ${isActive ?
                    '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' :
                    '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
                                    </button>
                                    <button onclick="deleteSession('${session.id}')" 
                                            class="p-2 hover:bg-red-500/10 text-slate-500 hover:text-red-500 rounded-lg transition-colors">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                </div>
                                
                                <button data-session-toggle="${session.id}" class="p-2 text-slate-500 hover:text-white transition-transform ${isExpanded ? 'rotate-180' : ''}">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                        </div>
                        
                        ${isExpanded ? `
                            <div class="border-t border-slate-800 bg-slate-900/30 p-6 space-y-3">
                                ${session.levels.length === 0 ? '<p class="text-center py-8 text-brand-muted font-bold italic">No levels in this session yet.</p>' : ''}
                                ${session.levels.map(level => renderLevelCard(session.id, level)).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            $container.html(html);
        }

        function renderLevelCard(sessionId, level) {
            const levelId = `${sessionId}_${level.uid}`;
            const isExpanded = expandedLevels.has(levelId);

            return `
                <div class="bg-brand-card border border-slate-800 rounded-xl overflow-hidden transition-all">
                        <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-800/50" data-level-toggle="${levelId}">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <h5 class="font-bold">${level.name}</h5>
                                    <span class="text-[10px] text-brand-muted">by ${level.author}</span>
                                    ${level.isCurrent ? '<span class="bg-brand-accent/20 text-brand-accent text-[9px] px-1.5 py-0.5 rounded font-black uppercase">CURRENT</span>' : ''}
                                    ${level.workshopID ? `<a href="https://steamcommunity.com/sharedfiles/filedetails/?id=${level.workshopID}" target="_blank" class="text-steam-accent hover:underline text-[10px]" onclick="event.stopPropagation()">Steam Workshop</a>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-6">
                            <div class="flex gap-4 text-xs font-black">
                                <span class="text-green-400">${level.yes} Y</span>
                                <span class="text-red-400">${level.no} N</span>
                                <span class="text-slate-400">${level.abstain} A</span>
                            </div>
                            <div class="w-24 h-2 bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full bg-brand-accent" style="width: ${level.yesPct}%"></div>
                            </div>
                            <svg class="w-4 h-4 text-slate-500 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>
                    
                    ${isExpanded ? `
                        <div class="p-4 bg-slate-900/50 border-t border-slate-800">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="text-brand-muted font-bold uppercase tracking-tighter border-b border-slate-800">
                                        <th class="pb-2">User ID</th>
                                        <th class="pb-2">Name</th>
                                        <th class="pb-2">Platform</th>
                                        <th class="pb-2 text-right">Vote</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/50">
                                    ${level.votes.map(v => `
                                        <tr>
                                            <td class="py-2 text-slate-500 font-mono text-[10px]">${v.user}</td>
                                            <td class="py-2 font-bold">${v.username}</td>
                                            <td class="py-2">
                                                <span class="px-1.5 py-0.5 bg-slate-800 rounded text-[9px]">${v.platform}</span>
                                            </td>
                                            <td class="py-2 text-right">
                                                <span class="font-black ${v.vote === 'YES' ? 'text-green-400' : (v.vote === 'NO' ? 'text-red-400' : 'text-slate-400')}">${v.vote}</span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${level.votes.length === 0 ? '<tr><td colspan="4" class="py-4 text-center text-brand-muted italic">No votes yet.</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleSession(id) {
            if (expandedSessions.has(id)) expandedSessions.delete(id);
            else expandedSessions.add(id);
            fetchDashboardData();
        }

        function toggleLevel(id) {
            if (expandedLevels.has(id)) expandedLevels.delete(id);
            else expandedLevels.add(id);
            fetchDashboardData();
        }

        function updateState(id, state) {
            $.ajax({
                url: `/playlistvoting/dashboard/session/${id}/state`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({state: state}),
                success: fetchDashboardData,
                error: function() { alert('Failed to update session state'); }
            });
        }

        function deleteSession(id) {
            if (!confirm('Really delete session?')) return;
            $.ajax({
                url: `/playlistvoting/dashboard/session/${id}/delete`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({}),
                success: fetchDashboardData,
                error: function() { alert('Failed to delete session'); }
            });
        }

        function createNewSession() {
            const name = $('#newSessionName').val();
            if (!name) {
                alert('Please enter a session name');
                return;
            }

            console.log('Creating new session via jQuery:', name);
            $.ajax({
                url: '/playlistvoting/dashboard/session/create',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({name: name}),
                success: function() {
                    console.log('Session created successfully');
                    closeModal();
                    fetchDashboardData();
                },
                error: function(xhr) {
                    let msg = 'Failed to create session';
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.message) msg += ': ' + data.message;
                    } catch(e) {}
                    alert(msg);
                }
            });
        }
    </script>
</div>

</body>
</html>
