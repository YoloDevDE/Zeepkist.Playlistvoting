<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/main-layout :: head('Playlist Voting - ' + ${host?.displayName ?: 'Unknown'})}"></th:block>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body th:replace="~{layout/main-layout :: layout('Dashboard', ~{:: .content-slot}, ~{:: .extra-slot})}">

<div class="content-slot w-full py-8 px-4">
    <!-- Breadcrumb -->
    <nav class="mb-8">
        <a class="inline-flex items-center gap-2 text-slate-500 hover:text-brand-accent transition-colors font-bold text-xs uppercase tracking-widest group"
           href="/playlistvoting">
            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none"
                 stroke="currentColor" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
            Back to Hosts
        </a>
    </nav>

    <div class="flex flex-col lg:flex-row gap-8 items-start">
        <!-- Sidebar -->
        <div class="w-full lg:w-80 lg:sticky lg:top-24 space-y-6 order-1 lg:order-2">
            <!-- Host Card -->
            <div class="bg-brand-card border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                <!-- Gimmick Background -->
                <div aria-hidden="true" class="absolute -top-4 -right-4 opacity-5">
                    <svg class="w-24 h-24 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>

                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center border-2 border-slate-700 shadow-lg overflow-hidden shrink-0">
                            <img class="w-full h-full object-cover" th:alt="${host?.displayName}" th:if="${host?.avatarUrl != null}"
                                 th:src="${host.avatarUrl}">
                            <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" th:if="${host?.avatarUrl == null}"
                                 viewBox="0 0 24 24">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"/>
                            </svg>
                        </div>
                        <div class="overflow-hidden">
                            <h1 class="text-xl font-black text-white truncate" th:text="${host?.displayName ?: 'Unknown'}">Host Name</h1>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-brand-accent/10 text-brand-accent border border-brand-accent/20"
                                  th:if="${isOwner}">
                                YOU (HOST)
                            </span>
                        </div>
                    </div>

                    <div class="space-y-4 mb-6">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Status</span>
                            <div class="flex items-center gap-2 text-brand-accent" id="wsStatus">
                                <span class="h-2 w-2 rounded-full bg-brand-accent animate-pulse"></span>
                                <span class="text-[10px] font-bold uppercase tracking-widest">Live</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Lobby</span>
                            <div class="flex items-center gap-2"
                                 id="lobbyStatus"
                                 th:classappend="${activeSession != null && activeSession.connected} ? 'text-green-500' : 'text-slate-500'">
                                <span class="h-2 w-2 rounded-full"
                                      id="lobbyStatusDot"
                                      th:classappend="${activeSession != null && activeSession.connected} ? 'bg-green-500 animate-pulse' : 'bg-slate-500'"></span>
                                <span class="text-[10px] font-bold uppercase tracking-widest"
                                      id="lobbyStatusText"
                                      th:text="${activeSession != null && activeSession.connected} ? 'Connected' : 'Offline'">Offline</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Steam ID</span>
                            <span class="text-slate-300 font-mono text-[11px]" th:text="${host?.getSteamId() ?: '...'}">...</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Sessions</span>
                            <span class="text-white font-bold" th:text="${sessions != null ? sessions.size() : 0}">0</span>
                        </div>
                    </div>

                    <button class="w-full py-3 bg-brand-accent text-brand-dark hover:scale-[1.02] active:scale-[0.98] rounded-xl font-black text-sm transition-all shadow-lg shadow-brand-accent/10 flex items-center justify-center gap-2"
                            id="newSessionBtn" th:if="${isOwner}">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        NEW SESSION
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 space-y-10 order-2 lg:order-1">
            <!-- Active Session View -->
            <div class="hidden" id="activeSessionView">
                <div class="flex flex-col xl:flex-row gap-6 items-stretch">
                    <!-- Active Level Panel -->
                    <div class="flex-1 min-w-0" id="activeLevelPanel">
                        <!-- Will be populated by JS -->
                        <div class="bg-brand-card border border-slate-800 rounded-2xl p-6 shadow-xl animate-pulse">
                            <div class="h-6 bg-slate-800 rounded w-1/4 mb-3"></div>
                            <div class="h-3 bg-slate-800 rounded w-1/2"></div>
                        </div>
                    </div>

                    <!-- Level List / History -->
                    <div class="xl:w-96 w-full flex flex-col h-full min-h-[400px]">
                        <div class="bg-brand-card border border-slate-800 rounded-2xl flex-1 flex flex-col overflow-hidden shadow-xl">
                            <div class="p-4 bg-slate-900/50 border-b border-slate-800 flex justify-between items-center">
                                <h4 class="text-xs font-black text-brand-muted uppercase tracking-widest">Queue & History</h4>
                                <span class="text-[10px] font-bold text-brand-accent bg-brand-accent/10 px-2 py-0.5 rounded-full"
                                      id="levelCountBadge">0 Maps</span>
                            </div>
                            <div class="flex-1 overflow-y-auto p-3 space-y-2 max-h-[600px] custom-scrollbar" id="sessionLevelList">
                                <!-- Populated by JS -->
                                <div class="text-center py-8 text-slate-600 italic text-xs">No levels in queue</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sessions List -->
            <div>
                <h3 class="text-2xl font-black mb-6 flex items-center gap-3">
                    Sessions
                    <span class="text-xs font-bold text-brand-accent bg-brand-accent/10 px-2.5 py-1 rounded-lg border border-brand-accent/20"
                          id="sessionCount">0</span>
                </h3>
                <div class="space-y-4" id="sessionsContainer">
                    <!-- Will be populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Session Modal -->
    <div class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/90 backdrop-blur-sm" id="editSessionModal">
        <div class="bg-brand-card border border-slate-800 rounded-3xl p-8 max-w-2xl w-full shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-brand-accent/5 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-black text-white">Edit Session</h2>
                    <button class="text-slate-500 hover:text-white transition-colors" onclick="closeEditModal()">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
                        </svg>
                    </button>
                </div>
                <div id="editSessionForm">
                    <!-- Form populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Level Detail Modal -->
    <div class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4 bg-brand-dark/90 backdrop-blur-sm" id="levelDetailModal">
        <div class="bg-brand-card border border-slate-800 rounded-3xl p-8 max-w-2xl w-full shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-brand-accent/5 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-black text-white" id="levelDetailTitle">Level Details</h2>
                    <button class="text-slate-500 hover:text-white transition-colors" onclick="closeLevelDetailModal()">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
                        </svg>
                    </button>
                </div>
                <div class="max-h-[70vh] overflow-y-auto custom-scrollbar pr-2" id="levelDetailContent">
                    <!-- Content populated by JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<div class="extra-slot">
    <!-- New Session Modal -->
    <div aria-labelledby="modal-title" aria-modal="true" class="hidden fixed inset-0 z-[60] overflow-y-auto"
         id="newSessionModal" role="dialog">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div aria-hidden="true" class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm transition-opacity"
                 id="modalBackdrop"></div>
            <span aria-hidden="true" class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-brand-card border border-slate-800 rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="p-8">
                    <h3 class="text-2xl font-black mb-6" id="modal-title">New Session</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2" for="newSessionName">Display
                                Name</label>
                            <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent/30 transition-all"
                                   id="newSessionName" placeholder="My Awesome Stream" required
                                   type="text">
                        </div>
                        <div class="pt-4 border-t border-slate-800 space-y-4">
                            <label class="flex items-center gap-2 cursor-pointer group" for="newSessionPlaylistMode">
                                <input class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-brand-accent focus:ring-brand-accent focus:ring-offset-0"
                                       id="newSessionPlaylistMode"
                                       onchange="document.getElementById('playlistConfigSection').classList.toggle('hidden', !this.checked)"
                                       type="checkbox">
                                <span class="text-sm font-bold text-slate-400 group-hover:text-white transition-colors">Playlist Mode</span>
                            </label>

                            <div>
                                <label class="block text-xs font-black text-brand-muted uppercase tracking-widest mb-2">Voting Mode</label>
                                <div class="flex bg-slate-900 rounded-xl p-1 border border-slate-800 max-w-[240px]">
                                    <button class="flex-1 px-4 py-2 rounded-lg text-xs font-bold transition-all bg-brand-accent text-white shadow-lg"
                                            id="new_btn_NORMAL" onclick="setNewVotingMode('NORMAL')"
                                            type="button">
                                        NORMAL
                                    </button>
                                    <button class="flex-1 px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white"
                                            id="new_btn_ABSTAIN_ENABLED" onclick="setNewVotingMode('ABSTAIN_ENABLED')"
                                            type="button">
                                        ABSTAIN
                                    </button>
                                </div>
                                <input id="newSessionVotingMode" type="hidden" value="NORMAL">
                                <p class="text-[10px] text-slate-500 mt-2 font-bold uppercase tracking-tight">Hint: Normal mode only uses
                                    Yes/No votes.</p>
                            </div>

                            <div class="space-y-4 hidden" id="playlistConfigSection">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2"
                                           for="newSessionPlaylistFile">Initial Playlist
                                        (.zeeplist)</label>
                                    <input accept=".zeeplist,application/json"
                                           class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2"
                                           id="newSessionPlaylistFile"
                                           type="file">
                                    <p class="text-[10px] text-slate-500 mt-1 uppercase font-bold">Hint: Session name will match playlist
                                        name</p>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2"
                                           for="newSessionRoundLength">Round Length
                                        (Seconds)</label>
                                    <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-all"
                                           id="newSessionRoundLength"
                                           step="1"
                                           type="number"
                                           value="300">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 flex gap-3">
                        <button class="flex-1 px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all border border-slate-700"
                                id="cancelModalBtn"
                                type="button">
                            Cancel
                        </button>
                        <button class="flex-1 px-4 py-3 bg-brand-accent text-brand-dark hover:bg-brand-accent/80 rounded-xl font-bold transition-all shadow-lg shadow-brand-accent/20"
                                id="submitCreateSessionBtn"
                                type="button">
                            Create
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // --- State ---
        const isOwner = /*[[${isOwner}]]*/ false;
        const isLoggedIn = /*[[${loggedIn}]]*/ false;
        const expandedSessions = new Set();
        const expandedLevels = new Set();
        let currentViewHostId = /*[[${host.id}]]*/ null;
        let stompClient = null;
        let sessions = [];
        let currentVote = null;

        // --- Initialization ---
        $(document).ready(function () {
            console.log('Dashboard initialized');

            initWebSocket();

            $('#newSessionBtn').on('click', openModal);
            $('#cancelModalBtn, #modalBackdrop').on('click', closeModal);
            $('#submitCreateSessionBtn').on('click', createNewSession);

            $('#newSessionPlaylistFile').on('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        try {
                            const zeeplist = JSON.parse(e.target.result);
                            if (zeeplist.name && !$('#newSessionName').val()) {
                                $('#newSessionName').val(zeeplist.name);
                            }
                        } catch (err) {
                        }
                    };
                    reader.readAsText(file);
                }
            });

            // Global delegate for dynamic elements
            $(document).on('click', '[data-session-toggle]', function () {
                toggleSession($(this).data('session-toggle'));
            });

            $(document).on('click', '[data-level-toggle]', function () {
                toggleLevel($(this).data('level-toggle'));
            });

            // Initial load
            fetchDashboardData();
        });

        function initWebSocket() {
            const socket = new SockJS('/ws-dashboard');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                $('#wsStatus').removeClass('text-slate-500').addClass('text-brand-accent');

                // Subscribe to host updates
                const hostId = /*[[${host.id}]]*/ null;
                if (hostId) {
                    stompClient.subscribe('/topic/dashboard/' + hostId + '/results', function () {
                        fetchDashboardData();
                    });
                    stompClient.subscribe('/topic/dashboard/' + hostId + '/timer', function (message) {
                        const data = JSON.parse(message.body);
                        updateTimerUI(data);
                    });
                }

                // Global updates (new hosts, etc)
                stompClient.subscribe('/topic/dashboard/global', function () {
                    if (!isLoggedIn && !currentViewHostId) {
                        // Refresh host list if on main guest page
                        location.reload();
                    } else if (currentViewHostId || isLoggedIn) {
                        fetchDashboardData();
                    }
                });
            }, function (error) {
                console.warn('WebSocket connection failed, retrying in 5s...');
                $('#wsStatus').removeClass('text-brand-accent animate-pulse').addClass('text-slate-500');
                setTimeout(initWebSocket, 5000);
            });
        }


        function openModal() {
            $('#newSessionModal').removeClass('hidden');
            $('#newSessionName').val('').focus();
        }

        function closeModal() {
            $('#newSessionModal').addClass('hidden');
        }

        function fetchDashboardData() {
            console.log('Fetching dashboard data...');
            let url = '/api/playlistvoting/dashboard';
            if (currentViewHostId) {
                url += '?hostId=' + currentViewHostId;
            }

            $.ajax({
                url: url,
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    renderDashboard(data);
                },
                error: function (xhr) {
                    if (xhr.status === 401 && isLoggedIn) {
                        window.location.href = '/login';
                    } else {
                        showError('Failed to fetch dashboard data (Status: ' + xhr.status + ')');
                    }
                }
            });
        }

        let timerInterval = null;
        let lastTimerData = null;

        function formatTimer(seconds) {
            if (seconds < 0) seconds = 0;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);

            const mm = m.toString().padStart(2, '0');
            const ss = s.toString().padStart(2, '0');

            if (h > 0) {
                const hh = h.toString().padStart(2, '0');
                return `${hh}:${mm}:${ss}`;
            }
            return `${mm}:${ss}`;
        }

        function updateTimerUI(data) {
            lastTimerData = data;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            const updateDisplay = () => {
                const display = $('#displayLobbyTimer');
                if (lastTimerData.gameState === 'ROUND_ENDING' || lastTimerData.gameState === 1) {
                    display.text('Round Ending');
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = null;
                } else if (lastTimerData.gameState === 'PODIUM' || lastTimerData.gameState === 2) {
                    display.text('Podium');
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = null;
                } else {
                    const now = Date.now();
                    const elapsedSincePacket = (now - lastTimerData.receivedAt) / 1000;
                    const currentZeepTime = lastTimerData.currentTime + elapsedSincePacket;
                    const timeLeft = (lastTimerData.levelLoadedAtTime + lastTimerData.roundTime) - currentZeepTime;

                    display.text(formatTimer(timeLeft));

                    if (timeLeft <= 0 && timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }
            };

            lastTimerData.receivedAt = Date.now();
            updateDisplay();

            if (lastTimerData.gameState === 'GAME' || lastTimerData.gameState === 0) {
                timerInterval = setInterval(updateDisplay, 1000);
            }
        }

        function showError(message) {
            $('#sessionsContainer').html(`
                <div class="bg-red-500/10 border border-red-500/50 rounded-2xl p-8 text-center">
                    <h4 class="text-red-500 font-bold mb-2">Error</h4>
                    <p class="text-slate-400 text-sm">${message}</p>
                    <button id="retryBtn" class="mt-4 px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold">Retry</button>
                </div>
            `);
            $('#retryBtn').on('click', fetchDashboardData);
        }

        function renderDashboard(data) {
            data = data || {sessions: []};
            sessions = data.sessions || [];
            currentVote = data.currentVote || null;

            const activeSession = sessions.find(s => s.state === 'ACTIVE' || s.state === 'PAUSED');

            if (activeSession) {
                $('#activeSessionView').removeClass('hidden');
                renderActiveSessionContent(activeSession, data);
            } else {
                $('#activeSessionView').addClass('hidden');
                renderActiveLevel(data.currentLevel, data.currentVotes, data.activeSessionName, data.playlistMode, data.currentVeto, null, currentVote, data);
            }

            if (data.lobbyGameState) {
                updateTimerUI({
                    roundTime: data.roundTime,
                    levelLoadedAtTime: data.levelLoadedAtTime,
                    currentTime: data.currentTime,
                    gameState: data.lobbyGameState
                });
            }

            renderSessions(sessions);

            // Update Lobby Status
            const $lobbyStatus = $('#lobbyStatus');
            const $lobbyStatusDot = $('#lobbyStatusDot');
            const $lobbyStatusText = $('#lobbyStatusText');

            if (data.isConnected) {
                $lobbyStatus.removeClass('text-slate-500').addClass('text-green-500');
                $lobbyStatusDot.removeClass('bg-slate-500').addClass('bg-green-500 animate-pulse');
                $lobbyStatusText.text('Connected');
            } else {
                $lobbyStatus.removeClass('text-green-500').addClass('text-slate-500');
                $lobbyStatusDot.removeClass('bg-green-500 animate-pulse').addClass('bg-slate-500');
                $lobbyStatusText.text('Offline');
            }
        }

        function renderActiveSessionContent(session, data) {
            renderActiveLevel(data.currentLevel, data.currentVotes, data.activeSessionName, data.playlistMode, data.currentVeto, session, data.currentVote, data);

            const $levelList = $('#sessionLevelList');
            let levels = session.levels || [];

            // Enrich with current status
            levels = levels.map(l => {
                if (data.currentLevel && l.uid === data.currentLevel.uid) {
                    return {...l, displayStatus: 'CURRENT'};
                }
                return {...l, displayStatus: l.status};
            });

            const current = levels.filter(l => l.displayStatus === 'CURRENT');
            const upcoming = levels.filter(l => l.displayStatus !== 'CURRENT' && l.displayStatus !== 'VOTING_FINISHED');
            const voted = levels.filter(l => l.displayStatus === 'VOTING_FINISHED');

            // Sorting voted by playedLevels order (reverse chronological)
            voted.sort((a, b) => {
                const indexA = session.playedLevels ? session.playedLevels.indexOf(a.uid) : -1;
                const indexB = session.playedLevels ? session.playedLevels.indexOf(b.uid) : -1;
                return indexB - indexA;
            });

            // Upcoming sort: by playlist order
            upcoming.sort((a, b) => {
                const indexA = session.playlist ? session.playlist.indexOf(a.uid) : -1;
                const indexB = session.playlist ? session.playlist.indexOf(b.uid) : -1;
                return indexA - indexB;
            });

            $('#levelCountBadge').text(levels.length + ' Maps');

            if (levels.length === 0) {
                $levelList.html('<div class="text-center py-8 text-slate-600 italic text-xs">No levels in queue</div>');
                return;
            }

            let html = '';

            if (current.length > 0) {
                html += `<div class="mb-4">
                    <h6 class="text-[10px] font-black text-brand-accent uppercase tracking-widest mb-2 px-1 flex items-center gap-2">
                        <span class="h-1.5 w-1.5 rounded-full bg-brand-accent animate-pulse"></span>
                        Active Map
                    </h6>
                    ${current.map(l => renderSidebarLevel(session.id, l)).join('')}
                </div>`;
            }

                const won = l.veto === 'YES' || (l.veto !== 'NO' && l.yes > l.no);
                if (won) {
                    statusIcon = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" /></svg>`;

                            </div>
                        </div>
                    `;
                } else {
                    actionsHtml = `
                        <div class="flex items-center gap-3 relative z-30">
                             <div class="p-2 text-slate-500 transition-transform ${isExpanded ? 'rotate-180' : ''}">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        function openLevelDetail(sessionId, levelUid) {
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return;
            const level = session.levels.find(l => l.uid === levelUid);
            if (!level) return;

            $('#levelDetailTitle').text(level.name);
            const content = renderLevelCard(sessionId, level, true);

        function toggleSession(id) {
            if (expandedSessions.has(id)) expandedSessions.delete(id);
            else expandedSessions.add(id);
            fetchDashboardData();
        }

        function toggleLevel(id) {
            if (expandedLevels.has(id)) expandedLevels.delete(id);
            else expandedLevels.add(id);
            fetchDashboardData();
        }

            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/state`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({state: state}),
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to update session state');
                }
            });
        }

        function updateLevelStatus(sessionId, uid, status) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/levels/status`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, status: status}),
                error: function (xhr) {
                    alert('Failed to update level status: ' + xhr.responseText);
                }
            });
        }

        function castSessionVeto(sessionId, uid, veto) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/levels/veto`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, veto: veto}),
                error: function (xhr) {
                    alert('Veto failed: ' + xhr.responseText);
                }
            });
        }

        function renameSession(id, currentName) {
            const newName = prompt('Enter new session name:', currentName);
            if (newName === null || newName === currentName || newName.trim() === '') return;

            $.ajax({
                url: `/api/playlistvoting/sessions/${id}`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({name: newName}),
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to rename session');
                }
            });
        }

        function activateSession(id) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/state`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({state: 'ACTIVE'}),
                success: function () {
                    fetchDashboardData();
                },
                error: function (xhr) {
                    alert('Failed to activate session: ' + xhr.responseText);
                }
            });
        }

        function resetVotes(id) {
            if (!confirm('Really reset ALL votes for this session? This cannot be undone.')) return;
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/votes`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to reset votes');
                }
            });
        }

        function deleteVote(voteId) {
            if (!confirm('Remove this vote?')) return;
            $.ajax({
                url: `/api/playlistvoting/votes/${voteId}`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to delete vote');
                }
            });
        }

        function castDashboardVote(option) {
            if (currentVote === option) {
                option = 'REMOVE';
            }
            $.ajax({
                url: '/api/playlistvoting/dashboard/votes',
                method: 'POST',
                data: {
                    hostId: currentViewHostId,
                    vote: option
                },
                success: function (result) {
                    console.log('Vote cast:', result);
                    // UI update via WebSocket
                },
                error: function (xhr) {
                    alert('Failed to cast vote: ' + xhr.responseText);
                }
            });
        }

                                <button onclick="setEditVotingMode('${session.id}', 'ABSTAIN_ENABLED')" id="edit_btn_ABSTAIN_ENABLED_${session.id}" class="flex-1 px-4 py-2 rounded-lg text-xs font-bold transition-all ${isAbstainEnabled ? 'bg-brand-accent text-white shadow-lg' : 'text-slate-400 hover:text-white'}">ABSTAIN</button>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">

                    ${(!session.playlist || session.playlist.length === 0) ? `
                    <div class="p-4 bg-orange-500/10 border border-orange-500/20 rounded-xl flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        function closeEditModal() {
            $('#editSessionModal').addClass('hidden');
        }

        function setEditState(sessionId, state) {
            $(`#edit_state_${sessionId}`).val(state);
            $(`[id^=edit_btn_][id$=${sessionId}]`).removeClass('bg-green-500 bg-orange-500 bg-red-500 text-white shadow-lg').addClass('text-slate-400 hover:text-white');

            let colorClass = 'bg-brand-accent';
            if (state === 'ACTIVE') colorClass = 'bg-green-500';
            else if (state === 'PAUSED') colorClass = 'bg-orange-500';
            else if (state === 'FINISHED') colorClass = 'bg-red-500';

            $(`#edit_btn_${state}_${sessionId}`).removeClass('text-slate-400 hover:text-white').addClass(colorClass + ' text-white shadow-lg');
        }

        function setEditVotingMode(sessionId, mode) {
            $(`#edit_votingMode_${sessionId}`).val(mode);
            $(`#edit_btn_NORMAL_${sessionId}, #edit_btn_ABSTAIN_ENABLED_${sessionId}`).removeClass('bg-brand-accent text-white shadow-lg').addClass('text-slate-400 hover:text-white');
            $(`#edit_btn_${mode}_${sessionId}`).removeClass('text-slate-400 hover:text-white').addClass('bg-brand-accent text-white shadow-lg');
        }

        function setNewVotingMode(mode) {
            $('#newSessionVotingMode').val(mode);
            $('#new_btn_NORMAL, #new_btn_ABSTAIN_ENABLED').removeClass('bg-brand-accent text-white shadow-lg').addClass('text-slate-400 hover:text-white');
            $(`#new_btn_${mode}`).removeClass('text-slate-400 hover:text-white').addClass('bg-brand-accent text-white shadow-lg');
        }

        function saveEditSettings(sessionId) {
            const name = $(`#edit_name_${sessionId}`).val();
            const state = $(`#edit_state_${sessionId}`).val();
            const votingMode = $(`#edit_votingMode_${sessionId}`).val();
            const playlistMode = $(`#edit_playlistmode_${sessionId}`).prop('checked');
            const fileInput = document.getElementById(`edit_file_${sessionId}`);

            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/settings`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({
                    displayName: name,
                    state: state,
                    votingMode: votingMode,
                    playlistMode: playlistMode
                }),
                success: function () {
                    if (fileInput && fileInput.files.length > 0) {
                        uploadZeeplist(sessionId, fileInput);
                        closeEditModal();
                    } else {
                        closeEditModal();
                        fetchDashboardData();
                    }
                },
                error: function (xhr) {
                    alert('Failed to save settings: ' + xhr.responseText);
                }
            });
        }


        function createNewSession() {
            const name = $('#newSessionName').val();
            const playlistMode = $('#newSessionPlaylistMode').prop('checked');
            const votingMode = $('#newSessionVotingMode').val() || 'NORMAL';
            const roundLength = parseFloat($('#newSessionRoundLength').val()) || 300;
            const fileInput = document.getElementById('newSessionPlaylistFile');

            if (!name) {
                alert('Please enter a session name');
                return;
            }

            const sendRequest = (zeeplistData) => {
                $.ajax({
                    url: '/api/playlistvoting/sessions',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        name: name,
                        playlistMode: playlistMode,
                        votingMode: votingMode,
                        roundLength: roundLength,
                        zeeplist: zeeplistData
                    }),
                    success: function () {
                        closeModal();
                        fetchDashboardData();
                    },
                    error: function (xhr) {
                        let msg = 'Failed to create session';
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data.message) msg += ': ' + data.message;
                        } catch (e) {
                        }
                        alert(msg);
                    }
                });
            };

            if (playlistMode && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const zeeplist = JSON.parse(e.target.result);
                        sendRequest(zeeplist);
                    } catch (err) {
                        alert('Error parsing .zeeplist file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            } else {
                sendRequest(null);
            }
        }

        function castVeto(uid, veto) {
            $.ajax({
                url: '/api/playlistvoting/sessions/active/veto',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, veto: veto}),
                error: function (xhr) {
                    alert('Veto failed: ' + xhr.responseText);
                }
            });
        }

        function uploadZeeplist(sessionId, input) {
            if (input.files.length === 0) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const zeeplist = JSON.parse(e.target.result);
                    $.ajax({
                        url: `/api/playlistvoting/sessions/${sessionId}/playlist`,
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            zeeplist: zeeplist,
                            playlistMode: true
                        }),
                        success: function () {
                            fetchDashboardData();
                        },
                        error: function (xhr) {
                            alert('Upload failed: ' + xhr.responseText);
                        }
                    });
                } catch (err) {
                    alert('Error parsing .zeeplist file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function updatePlaylistMode(sessionId, mode) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/playlist`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    playlistMode: mode
                }),
                success: function () {
                    fetchDashboardData();
                },
                error: function (xhr) {
                    alert('Update failed: ' + xhr.responseText);
                }
            });
        }

        function downloadPlaylist(sessionId, type) {
            const session = sessions.find(s => s.id === sessionId);
            if (type === 'tovote' && (!session || !session.playlist || session.playlist.length === 0)) {
                alert('No levels in playlist to download.');
                return;
            }
            window.location.href = `/api/playlistvoting/sessions/${sessionId}/playlist?type=${type}`;
        }


        function deleteSession(sessionId) {
            if (!confirm('Are you sure you want to delete this session? This cannot be undone.')) return;
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}`,
                method: 'DELETE',
                success: function () {
                    if ($('#editSessionModal').is(':visible')) {
                        closeEditModal();
                    }
                    fetchDashboardData();
                },
                error: function (xhr) {
                    alert('Failed to delete session: ' + xhr.responseText);
                }
            });
        }

    </script>
</div>
</body>
</html>
