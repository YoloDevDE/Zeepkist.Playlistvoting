<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/main-layout :: head('Playlist Voting - ' + host.displayName)}"></th:block>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body th:replace="~{layout/main-layout :: layout('Dashboard', ~{:: .content-slot}, ~{:: .extra-slot})}">

<div class="content-slot w-full py-8 px-4">
    <!-- Breadcrumb -->
    <nav class="mb-8">
        <a class="inline-flex items-center gap-2 text-slate-500 hover:text-brand-accent transition-colors font-bold text-xs uppercase tracking-widest group"
           href="/playlistvoting">
            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none"
                 stroke="currentColor" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
            Back to Hosts
        </a>
    </nav>

    <div class="flex flex-col lg:flex-row gap-8 items-start">
        <!-- Sidebar -->
        <div class="w-full lg:w-80 lg:sticky lg:top-24 space-y-6 order-1 lg:order-2">
            <!-- Host Card -->
            <div class="bg-brand-card border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                <!-- Gimmick Background -->
                <div aria-hidden="true" class="absolute -top-4 -right-4 opacity-5">
                    <svg class="w-24 h-24 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>

                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center border-2 border-slate-700 shadow-lg overflow-hidden shrink-0">
                            <img class="w-full h-full object-cover" th:alt="${host.displayName}" th:if="${host.avatarUrl != null}"
                                 th:src="${host.avatarUrl}">
                            <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" th:if="${host.avatarUrl == null}"
                                 viewBox="0 0 24 24">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"/>
                            </svg>
                        </div>
                        <div class="overflow-hidden">
                            <h1 class="text-xl font-black text-white truncate" th:text="${host.displayName}">Host Name</h1>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-brand-accent/10 text-brand-accent border border-brand-accent/20"
                                  th:if="${isOwner}">
                                YOU (HOST)
                            </span>
                        </div>
                    </div>

                    <div class="space-y-4 mb-6">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Status</span>
                            <div class="flex items-center gap-2 text-brand-accent" id="wsStatus">
                                <span class="h-2 w-2 rounded-full bg-brand-accent animate-pulse"></span>
                                <span class="text-[10px] font-bold uppercase tracking-widest">Live</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Steam ID</span>
                            <span class="text-slate-300 font-mono text-[11px]" th:text="${host.getSteamId()}">...</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold uppercase text-[10px] tracking-wider">Sessions</span>
                            <span class="text-white font-bold" th:text="${sessions.size()}">0</span>
                        </div>
                    </div>

                    <button class="w-full py-3 bg-brand-accent text-brand-dark hover:scale-[1.02] active:scale-[0.98] rounded-xl font-black text-sm transition-all shadow-lg shadow-brand-accent/10 flex items-center justify-center gap-2"
                            id="newSessionBtn" th:if="${isOwner}">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        NEW SESSION
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 space-y-10 order-2 lg:order-1">
            <!-- Active Level Status -->
            <div id="activeLevelPanel">
                <!-- Will be populated by JS -->
                <div class="bg-brand-card border border-slate-800 rounded-2xl p-6 shadow-xl animate-pulse">
                    <div class="h-6 bg-slate-800 rounded w-1/4 mb-3"></div>
                    <div class="h-3 bg-slate-800 rounded w-1/2"></div>
                </div>
            </div>

            <!-- Sessions List -->
            <div>
                <h3 class="text-2xl font-black mb-6 flex items-center gap-3">
                    Sessions
                    <span class="text-xs font-bold text-brand-accent bg-brand-accent/10 px-2.5 py-1 rounded-lg border border-brand-accent/20"
                          id="sessionCount">0</span>
                </h3>
                <div class="space-y-4" id="sessionsContainer">
                    <!-- Will be populated by JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<div class="extra-slot">
    <!-- New Session Modal -->
    <div aria-labelledby="modal-title" aria-modal="true" class="hidden fixed inset-0 z-[60] overflow-y-auto"
         id="newSessionModal" role="dialog">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div aria-hidden="true" class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm transition-opacity"
                 id="modalBackdrop"></div>
            <span aria-hidden="true" class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-brand-card border border-slate-800 rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="p-8">
                    <h3 class="text-2xl font-black mb-6" id="modal-title">New Session</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2" for="newSessionName">Display
                                Name</label>
                            <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent/30 transition-all"
                                   id="newSessionName" placeholder="My Awesome Stream" required
                                   type="text">
                        </div>
                        <div class="pt-4 border-t border-slate-800">
                            <label class="flex items-center gap-2 cursor-pointer group mb-4" for="newSessionPlaylistMode">
                                <input class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-brand-accent focus:ring-brand-accent focus:ring-offset-0"
                                       id="newSessionPlaylistMode"
                                       onchange="document.getElementById('playlistConfigSection').classList.toggle('hidden', !this.checked)"
                                       type="checkbox">
                                <span class="text-sm font-bold text-slate-400 group-hover:text-white transition-colors">Playlist Mode</span>
                            </label>

                            <label class="flex items-center gap-2 cursor-pointer group mb-4" for="newSessionAllowAbstain">
                                <input checked
                                       class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-brand-accent focus:ring-brand-accent focus:ring-offset-0"
                                       id="newSessionAllowAbstain"
                                       type="checkbox">
                                <span class="text-sm font-bold text-slate-400 group-hover:text-white transition-colors">Allow Abstain Votes</span>
                            </label>

                            <div class="space-y-4 hidden" id="playlistConfigSection">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2"
                                           for="newSessionPlaylistFile">Initial Playlist
                                        (.zeeplist)</label>
                                    <input accept=".zeeplist,application/json"
                                           class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2"
                                           id="newSessionPlaylistFile"
                                           type="file">
                                    <p class="text-[10px] text-slate-500 mt-1 uppercase font-bold">Hint: Session name will match playlist
                                        name</p>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2"
                                           for="newSessionRoundLength">Round Length
                                        (Seconds)</label>
                                    <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-all"
                                           id="newSessionRoundLength"
                                           step="1"
                                           type="number"
                                           value="300">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 flex gap-3">
                        <button class="flex-1 px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all border border-slate-700"
                                id="cancelModalBtn"
                                type="button">
                            Cancel
                        </button>
                        <button class="flex-1 px-4 py-3 bg-brand-accent text-brand-dark hover:bg-brand-accent/80 rounded-xl font-bold transition-all shadow-lg shadow-brand-accent/20"
                                id="submitCreateSessionBtn"
                                type="button">
                            Create
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // --- State ---
        const isOwner = /*[[${isOwner}]]*/ false;
        const isLoggedIn = /*[[${loggedIn}]]*/ false;
        const expandedSessions = new Set();
        const expandedLevels = new Set();
        let currentViewHostId = /*[[${host.id}]]*/ null;
        let stompClient = null;

        // --- Initialization ---
        $(document).ready(function () {
            console.log('Dashboard initialized');

            initWebSocket();

            $('#newSessionBtn').on('click', openModal);
            $('#cancelModalBtn, #modalBackdrop').on('click', closeModal);
            $('#submitCreateSessionBtn').on('click', createNewSession);

            $('#newSessionPlaylistFile').on('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        try {
                            const zeeplist = JSON.parse(e.target.result);
                            if (zeeplist.name && !$('#newSessionName').val()) {
                                $('#newSessionName').val(zeeplist.name);
                            }
                        } catch (err) {
                        }
                    };
                    reader.readAsText(file);
                }
            });

            // Global delegate for dynamic elements
            $(document).on('click', '[data-session-toggle]', function () {
                toggleSession($(this).data('session-toggle'));
            });

            $(document).on('click', '[data-level-toggle]', function () {
                toggleLevel($(this).data('level-toggle'));
            });

            // Initial load
            fetchDashboardData();
        });

        function initWebSocket() {
            const socket = new SockJS('/ws-dashboard');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                $('#wsStatus').removeClass('text-slate-500').addClass('text-brand-accent');

                // Subscribe to host updates
                const hostId = /*[[${host.id}]]*/ null;
                if (hostId) {
                    stompClient.subscribe('/topic/dashboard/' + hostId, function () {
                        fetchDashboardData();
                    });
                }

                // Global updates (new hosts, etc)
                stompClient.subscribe('/topic/dashboard/global', function () {
                    if (!isLoggedIn && !currentViewHostId) {
                        // Refresh host list if on main guest page
                        location.reload();
                    } else if (currentViewHostId || isLoggedIn) {
                        fetchDashboardData();
                    }
                });
            }, function (error) {
                console.warn('WebSocket connection failed, retrying in 5s...');
                $('#wsStatus').removeClass('text-brand-accent animate-pulse').addClass('text-slate-500');
                setTimeout(initWebSocket, 5000);
            });
        }


        function openModal() {
            $('#newSessionModal').removeClass('hidden');
            $('#newSessionName').val('').focus();
        }

        function closeModal() {
            $('#newSessionModal').addClass('hidden');
        }

        function fetchDashboardData() {
            console.log('Fetching dashboard data...');
            let url = '/api/playlistvoting/dashboard';
            if (currentViewHostId) {
                url += '?hostId=' + currentViewHostId;
            }

            $.ajax({
                url: url,
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    renderDashboard(data);
                },
                error: function (xhr) {
                    if (xhr.status === 401 && isLoggedIn) {
                        window.location.href = '/login';
                    } else {
                        showError('Failed to fetch dashboard data (Status: ' + xhr.status + ')');
                    }
                }
            });
        }

        function showError(message) {
            $('#sessionsContainer').html(`
                <div class="bg-red-500/10 border border-red-500/50 rounded-2xl p-8 text-center">
                    <h4 class="text-red-500 font-bold mb-2">Error</h4>
                    <p class="text-slate-400 text-sm">${message}</p>
                    <button id="retryBtn" class="mt-4 px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold">Retry</button>
                </div>
            `);
            $('#retryBtn').on('click', fetchDashboardData);
        }

        function renderDashboard(data) {
            renderActiveLevel(data.currentLevel, data.currentVotes, data.activeSessionName, data.lobbyTimer, data.playlistMode, data.currentVeto);
            renderSessions(data.sessions);

            if (isOwner && data.activeSessionName) {
                $('#playlistPanel').removeClass('hidden');
                $('#playlistModeCheckbox').prop('checked', data.playlistMode);
            } else {
                $('#playlistPanel').addClass('hidden');
            }
        }

        function renderActiveLevel(level, votes, activeSessionName, lobbyTimer, playlistMode, currentVeto) {
            const $panel = $('#activeLevelPanel');
            if (!$panel.length) return;

            if (!activeSessionName) {
                $panel.html(`
                    <div class="bg-brand-card border border-slate-800 rounded-2xl p-6 shadow-xl text-center">
                        <p class="text-brand-muted font-bold uppercase tracking-widest text-[10px] mb-1">Active Session</p>
                        <h2 class="text-xl font-black text-slate-500">NO ACTIVE SESSION</h2>
                        <p class="text-slate-600 text-[10px] mt-2 italic">${isLoggedIn ? 'Activate a session below to start voting' : 'Host is currently offline'}</p>
                    </div>
                `);
                return;
            }

            if (!level) {
                $panel.html(`
                    <div class="bg-brand-card border border-slate-800 rounded-2xl p-6 shadow-xl text-center">
                        <div class="flex flex-col items-center">
                            <p class="text-brand-accent font-bold uppercase tracking-widest text-[10px] mb-1">Active Session: ${activeSessionName}</p>
                            <div class="h-px w-24 bg-brand-accent/20 mb-4"></div>
                            <h2 class="text-xl font-black text-slate-500 uppercase">No active map</h2>
                            <p class="text-slate-600 text-[10px] mt-2 italic">Waiting for host to start a vote</p>
                        </div>
                    </div>
                `);
                return;
            }

            const voteHtml = votes ? `
                <div class="mt-6">
                    <div class="flex justify-between items-end mb-1">
                        <div class="flex gap-4">
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black text-green-400 uppercase tracking-widest">Yes</span>
                                <span class="text-xl font-black">${votes.yes}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black text-red-400 uppercase tracking-widest">No</span>
                                <span class="text-xl font-black">${votes.no}</span>
                            </div>
                            ${votes.allowAbstain ? `
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Abstain</span>
                                <span class="text-xl font-black">${votes.abstain}</span>
                            </div>
                            ` : ''}
                        </div>
                        <div class="text-right">
                            <span class="text-[9px] font-black text-brand-accent uppercase tracking-widest">Total Votes</span>
                            <p class="text-xl font-black">${votes.total}</p>
                        </div>
                    </div>
                    
                    <div class="h-3 w-full bg-slate-800 rounded-full overflow-hidden flex shadow-inner">
                        <div class="h-full bg-green-500 transition-all duration-500 ease-out" style="width: ${votes.total > 0 ? (votes.yes / votes.total * 100) : 0}%"></div>
                        <div class="h-full bg-red-500 transition-all duration-500 ease-out" style="width: ${votes.total > 0 ? (votes.no / votes.total * 100) : 0}%"></div>
                        ${votes.allowAbstain ? `<div class="h-full bg-white transition-all duration-500 ease-out" style="width: ${votes.total > 0 ? (votes.abstain / votes.total * 100) : 0}%"></div>` : ''}
                    </div>
                    
                    <div class="mt-3 flex justify-center">
                         <div class="bg-brand-accent/10 border border-brand-accent/20 px-3 py-1 rounded-lg">
                            <span class="text-brand-accent font-black text-sm">${votes.yesPct}% YES</span>
                         </div>
                    </div>
                </div>
            ` : '';

            $panel.html(`
                <div class="bg-brand-card border-2 border-brand-accent/30 rounded-2xl p-6 shadow-2xl relative overflow-hidden group">
                    <!-- Background Thumbnail -->
                    ${level.thumbnailUrl ? `
                    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
                        <img src="${level.thumbnailUrl}" class="w-full h-full object-cover opacity-15 blur-[2px] scale-105 group-hover:scale-110 transition-transform duration-700" alt="">
                        <div class="absolute inset-0 bg-gradient-to-br from-brand-card via-brand-card/80 to-transparent"></div>
                    </div>
                    ` : `
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity z-0">
                        <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    `}

                    <div class="relative z-10">
                        <div class="mb-3 flex justify-between items-start">
                            <div>
                                <p class="text-brand-muted font-bold uppercase tracking-widest text-[9px] mb-0.5">Active Session</p>
                                <h3 class="text-lg font-black text-white">${activeSessionName}</h3>
                            </div>
                            <div class="text-right">
                                <p class="text-brand-muted font-bold uppercase tracking-widest text-[9px] mb-0.5">Lobby Timer</p>
                                <h3 class="text-xl font-black text-brand-accent">${lobbyTimer || '0:00'}</h3>
                            </div>
                        </div>
                        <div class="h-px w-full bg-slate-800/50 mb-4"></div>
                        <p class="text-brand-accent font-bold uppercase tracking-widest text-[10px] mb-1 flex items-center gap-2">
                            <span class="relative flex h-1.5 w-1.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-brand-accent"></span>
                            </span>
                            Active Level
                        </p>
                        <h2 class="text-3xl font-black mb-0.5 truncate">${level.name}</h2>
                        <p class="text-brand-muted font-bold text-base">by ${level.author}</p>
                        ${level.workshopID ? `<a href="https://steamcommunity.com/sharedfiles/filedetails/?id=${level.workshopID}" target="_blank" class="text-steam-accent hover:underline text-[10px] block mt-1">Steam Workshop</a>` : ''}
                        ${voteHtml}
                        
                        ${isOwner ? `
                        <div class="mt-8 pt-8 border-t border-slate-800/50">
                        <div class="flex flex-col sm:flex-row items-center gap-4">
                            <span class="text-[10px] font-black text-brand-muted uppercase tracking-widest">Host Veto</span>
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="castVeto('${level.uid}', 'YES')" class="flex-1 sm:flex-initial px-4 py-2 bg-green-600/20 hover:bg-green-600 text-green-400 hover:text-white border border-green-600/30 rounded-lg text-xs font-bold transition-all ${currentVeto === 'YES' ? 'bg-green-600 text-white ring-2 ring-green-400 ring-offset-2 ring-offset-brand-dark' : ''}">VETO YES</button>
                                <button onclick="castVeto('${level.uid}', 'NO')" class="flex-1 sm:flex-initial px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/30 rounded-lg text-xs font-bold transition-all ${currentVeto === 'NO' ? 'bg-red-600 text-white ring-2 ring-red-400 ring-offset-2 ring-offset-brand-dark' : ''}">VETO NO</button>
                                <button onclick="castVeto('${level.uid}', null)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-lg text-xs font-bold transition-all">CLEAR</button>
                            </div>
                            ${currentVeto ? `<span class="text-xs font-bold text-brand-accent animate-pulse uppercase">Vetoed: ${currentVeto}</span>` : ''}
                        </div>
                    </div>
                    ` : (currentVeto ? `
                    <div class="mt-6 p-4 bg-brand-accent/5 border border-brand-accent/20 rounded-xl text-center">
                        <span class="text-xs font-bold text-brand-accent uppercase tracking-widest">Host has vetoed this level: ${currentVeto}</span>
                    </div>
                    ` : '')}
                    
                    ${isLoggedIn ? `
                        <div class="mt-8 flex justify-center">
                            <div class="inline-flex rounded-2xl shadow-lg shadow-brand-accent/10 overflow-hidden border border-slate-700 w-full max-w-lg h-16">
                                <button onclick="castDashboardVote('YES')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-black text-xl transition-all flex items-center justify-center gap-2 transform active:scale-95 border-r border-slate-700/50">
                                    YES
                                </button>
                                ${votes && votes.allowAbstain ? `
                                <button onclick="castDashboardVote('ABSTAIN')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-black text-xl transition-all flex items-center justify-center gap-2 transform active:scale-95 border-r border-slate-700/50">
                                    GRAY
                                </button>
                                ` : ''}
                                <button onclick="castDashboardVote('NO')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-black text-xl transition-all flex items-center justify-center gap-2 transform active:scale-95">
                                    NO
                                </button>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-center">
                            <button onclick="castDashboardVote('REMOVE')" class="text-slate-500 hover:text-slate-300 text-[10px] font-black uppercase tracking-widest transition-colors">
                                Remove my vote
                            </button>
                        </div>
                    ` : ''}
                    </div>
                </div>
            `);
        }

        function renderSessions(sessions) {
            $('#sessionCount').text(sessions.length);
            const $container = $('#sessionsContainer');

            if (sessions.length === 0) {
                $container.html(`
                    <div class="bg-brand-card/30 border-2 border-dashed border-slate-800 rounded-3xl p-12 text-center">
                        <h4 class="text-xl font-black mb-3 text-slate-500">No sessions found</h4>
                    </div>
                `);
                return;
            }

            const html = sessions.map(session => {
                const isExpanded = expandedSessions.has(session.id);
                const isActive = session.state === 'ACTIVE';
                const isPaused = session.state === 'PAUSED';
                const isFinished = session.state === 'FINISHED';

        function toggleSession(id) {
            if (expandedSessions.has(id)) expandedSessions.delete(id);
            else expandedSessions.add(id);
            fetchDashboardData();
        }

        function toggleLevel(id) {
            if (expandedLevels.has(id)) expandedLevels.delete(id);
            else expandedLevels.add(id);
            fetchDashboardData();
        }

        function updateState(id, state) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/state`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({state: state}),
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to update session state');
                }
            });
        }

        function updateLevelStatus(sessionId, uid, status) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/levels/status`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, status: status}),
                error: function (xhr) {
                    alert('Failed to update level status: ' + xhr.responseText);
                }
            });
        }

        function castSessionVeto(sessionId, uid, veto) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/levels/veto`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, veto: veto}),
                error: function (xhr) {
                    alert('Veto failed: ' + xhr.responseText);
                }
            });
        }

        function renameSession(id, currentName) {
            const newName = prompt('Enter new session name:', currentName);
            if (newName === null || newName === currentName || newName.trim() === '') return;

            $.ajax({
                url: `/api/playlistvoting/sessions/${id}`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({name: newName}),
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to rename session');
                }
            });
        }

        function deleteSession(id) {
            if (!confirm('Really delete session?')) return;
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to delete session');
                }
            });
        }

        function resetVotes(id) {
            if (!confirm('Really reset ALL votes for this session? This cannot be undone.')) return;
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/votes`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to reset votes');
                }
            });
        }

        function deleteVote(voteId) {
            if (!confirm('Remove this vote?')) return;
            $.ajax({
                url: `/api/playlistvoting/votes/${voteId}`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to delete vote');
                }
            });
        }

        function castDashboardVote(option) {
            $.ajax({
                url: '/api/playlistvoting/dashboard/votes',
                method: 'POST',
                data: {
                    hostId: currentViewHostId,
                    vote: option
                },
                success: function (result) {
                    console.log('Vote cast:', result);
                    // UI update via WebSocket
                },
                error: function (xhr) {
                    alert('Failed to cast vote: ' + xhr.responseText);
                }
            });
        }

        function createNewSession() {
            const name = $('#newSessionName').val();
            const playlistMode = $('#newSessionPlaylistMode').prop('checked');
            const allowAbstain = $('#newSessionAllowAbstain').prop('checked');
            const roundLength = parseFloat($('#newSessionRoundLength').val()) || 300;
            const fileInput = document.getElementById('newSessionPlaylistFile');

            if (!name) {
                alert('Please enter a session name');
                return;
            }

            const sendRequest = (zeeplistData) => {
                $.ajax({
                    url: '/api/playlistvoting/sessions',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        name: name,
                        playlistMode: playlistMode,
                        allowAbstain: allowAbstain,
                        roundLength: roundLength,
                        zeeplist: zeeplistData
                    }),
                    success: function () {
                        closeModal();
                        fetchDashboardData();
                    },
                    error: function (xhr) {
                        let msg = 'Failed to create session';
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data.message) msg += ': ' + data.message;
                        } catch (e) {
                        }
                        alert(msg);
                    }
                });
            };

            if (playlistMode && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const zeeplist = JSON.parse(e.target.result);
                        sendRequest(zeeplist);
                    } catch (err) {
                        alert('Error parsing .zeeplist file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            } else {
                sendRequest(null);
            }
        }

        function castVeto(uid, veto) {
            $.ajax({
                url: '/api/playlistvoting/sessions/active/veto',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, veto: veto}),
                error: function (xhr) {
                    alert('Veto failed: ' + xhr.responseText);
                }
            });
        }

        function uploadZeeplist(sessionId, input) {
            if (input.files.length === 0) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const zeeplist = JSON.parse(e.target.result);
                    $.ajax({
                        url: `/api/playlistvoting/sessions/${sessionId}/playlist`,
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            zeeplist: zeeplist,
                            playlistMode: true
                        }),
                        success: function () {
                            fetchDashboardData();
                        },
                        error: function (xhr) {
                            alert('Upload failed: ' + xhr.responseText);
                        }
                    });
                } catch (err) {
                    alert('Error parsing .zeeplist file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function updatePlaylistMode(sessionId, mode) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${sessionId}/playlist`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    playlistMode: mode
                }),
                success: function () {
                    fetchDashboardData();
                },
                error: function (xhr) {
                    alert('Update failed: ' + xhr.responseText);
                }
            });
        }

        function downloadPlaylist(sessionId, type) {
            window.location.href = `/api/playlistvoting/sessions/${sessionId}/playlist?type=${type}`;
        }

        function setSettingsState(sessionId, state) {
            $(`#settings_state_${sessionId}`).val(state);
            $(`[id^=btn_state_][id$=${sessionId}]`).removeClass('bg-green-500/20 border-green-500 text-green-400 bg-yellow-500/20 border-yellow-500 text-yellow-400 bg-red-500/20 border-red-500 text-red-400').addClass('bg-slate-900/50 border-slate-700 text-slate-500 hover:border-slate-500');

            let colorClass = '';
            if (state === 'ACTIVE') colorClass = 'bg-green-500/20 border-green-500 text-green-400';
            else if (state === 'PAUSED') colorClass = 'bg-yellow-500/20 border-yellow-500 text-yellow-400';
            else if (state === 'FINISHED') colorClass = 'bg-red-500/20 border-red-500 text-red-400';

            $(`#btn_state_${state}_${sessionId}`).removeClass('bg-slate-900/50 border-slate-700 text-slate-500 hover:border-slate-500').addClass(colorClass);
        }

        function saveSessionSettings(sessionId) {
            const name = $(`#settings_name_${sessionId}`).val();
            const state = $(`#settings_state_${sessionId}`).val();
            const allowAbstain = $(`#settings_abstain_${sessionId}`).prop('checked');
            const playlistMode = $(`#settings_playlistmode_${sessionId}`).prop('checked');
            const fileInput = document.getElementById(`settings_file_${sessionId}`);

            const doUpdate = (zeeplist) => {
                $.ajax({
                    url: `/api/playlistvoting/sessions/${sessionId}/settings`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        displayName: name,
                        state: state,
                        allowAbstain: allowAbstain,
                        playlistMode: playlistMode,
                        playlist: zeeplist ? null : undefined // Backend handles zeeplist separately if needed, but here we bundle
                    }),
                    success: function () {
                        if (zeeplist) {
                            // If we have a zeeplist, we need to upload it too. 
                            // Our new endpoint could handle it, but for now let's use the existing one if needed or just update settings.
                            // Actually, let's just use uploadZeeplist logic if a file is selected.
                            uploadZeeplist(sessionId, fileInput);
                        } else {
                            fetchDashboardData();
                        }
                    },
                    error: function (xhr) {
                        alert('Failed to save settings: ' + xhr.responseText);
                    }
                });
            };

            if (fileInput && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const zeeplist = JSON.parse(e.target.result);
                        // We'll upload the zeeplist separately to keep it simple, or we could have bundled it.
                        // For now, let's just save settings then upload.
                        doUpdate(zeeplist);
                    } catch (err) {
                        alert('Error parsing .zeeplist: ' + err.message);
                    }
                };
                reader.readAsText(file);
            } else {
                doUpdate(null);
            }
        }

    </script>
</div>

</body>
</html>
