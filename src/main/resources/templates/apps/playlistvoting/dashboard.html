<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/main-layout :: head('Playlist Voting - ' + host.displayName)}"></th:block>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body th:replace="~{layout/main-layout :: layout('Dashboard', ~{:: .content-slot}, ~{:: .extra-slot})}">

<div class="content-slot w-full max-w-6xl mx-auto py-8">
    <!-- Breadcrumb -->
    <nav class="mb-6">
        <a class="inline-flex items-center gap-2 text-slate-400 hover:text-brand-accent transition-colors font-bold text-sm group"
           href="/playlistvoting">
            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none"
                 stroke="currentColor" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
            BACK TO HOST LIST
        </a>
    </nav>

    <!-- Host Information Header -->
    <div class="bg-brand-card border border-slate-800 rounded-3xl p-8 mb-8 flex flex-col md:flex-row items-center gap-6 shadow-2xl relative overflow-hidden">
        <!-- Gimmick Background -->
        <div class="absolute top-0 right-0 p-8 opacity-5">
            <svg class="w-32 h-32 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
        </div>

        <div class="w-24 h-24 bg-slate-800 rounded-2xl flex items-center justify-center border-2 border-slate-700 shadow-xl overflow-hidden">
            <svg class="w-12 h-12 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2"/>
            </svg>
        </div>

        <div class="text-center md:text-left flex-1 z-10">
            <div class="flex flex-col md:flex-row md:items-center gap-2 mb-2">
                <h1 class="text-3xl font-black text-white" th:text="${host.displayName}">Host Name</h1>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-brand-accent/10 text-brand-accent border border-brand-accent/20"
                      th:if="${isOwner}">
                    YOU (HOST)
                </span>
            </div>
            <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm font-medium">
                <div class="flex items-center gap-1.5 text-slate-400">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/>
                    </svg>
                    <span th:text="${host.getSteamId()}">76561198000000000</span>
                </div>
                <div class="flex items-center gap-1.5 text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                              stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                    <span th:text="${sessions.size() + ' Sessions'}">12 Sessions</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4 z-10">
            <div class="flex items-center gap-2 text-brand-accent animate-pulse" id="wsStatus">
                <span class="h-2 w-2 rounded-full bg-brand-accent"></span>
                <span class="text-[10px] font-bold uppercase tracking-widest">Live</span>
            </div>
            <button class="px-6 py-3 bg-brand-accent text-brand-dark hover:scale-105 rounded-xl font-black text-sm transition-all shadow-lg shadow-brand-accent/10 flex items-center gap-2"
                    id="newSessionBtn" th:if="${isOwner}">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                NEW SESSION
            </button>
        </div>
    </div>

    <!-- Playlist Panel (Owner Only) -->
    <div class="mb-10 hidden" id="playlistPanel" th:if="${isOwner}">
        <div class="bg-brand-card border border-slate-800 rounded-2xl p-8 shadow-xl">
            <h3 class="text-xl font-black mb-4 uppercase tracking-wider flex items-center gap-2">
                <svg class="w-6 h-6 text-brand-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                          stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                Playlist Management
            </h3>
            <div class="mb-4">
                <label class="block text-xs font-black mb-2 uppercase tracking-widest text-brand-muted">Upload .zeeplist File</label>
                <div class="flex flex-col gap-2">
                    <input accept=".zeeplist,application/json"
                           class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2"
                           id="zeeplistFileUpload"
                           type="file">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tight">
                        <svg class="w-3 h-3 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                                  stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        Tip: Playlists are usually in <code class="text-brand-accent bg-slate-800 px-1 rounded">%AppData%\Roaming\Zeepkist\Playlists</code>
                    </p>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-brand-accent focus:ring-brand-accent focus:ring-offset-0"
                           id="playlistModeCheckbox"
                           type="checkbox">
                    <span class="text-sm font-bold text-slate-400 group-hover:text-white transition-colors">Playlist Mode Active</span>
                </label>
                <button class="w-full sm:w-auto sm:ml-auto px-8 py-3 bg-brand-accent text-brand-dark rounded-xl font-black text-sm transition-all hover:scale-105 shadow-lg shadow-brand-accent/20"
                        onclick="updatePlaylist()">
                    SAVE SETTINGS
                </button>
            </div>

            <!-- Download Playlist Section -->
            <div class="mt-8 pt-8 border-t border-slate-800">
                <h4 class="text-xs font-black mb-4 uppercase tracking-widest text-brand-muted">Export Session Data (.zeeplist)</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <button class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 border border-slate-700"
                            onclick="downloadActivePlaylist('all')">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M7 10l5 5m0 0l5-5m-5 5V3" stroke-linecap="round"
                                  stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        FULL PLAYLIST
                    </button>
                    <button class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 border border-slate-700"
                            onclick="downloadActivePlaylist('tovote')">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                                  stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        TO VOTE
                    </button>
                    <button class="px-4 py-3 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-500 rounded-xl text-xs font-bold transition-all border border-emerald-500/20 flex items-center justify-center gap-2"
                            onclick="downloadActivePlaylist('yes')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                                  stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        YES VOTES
                    </button>
                    <button class="px-4 py-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 rounded-xl text-xs font-bold transition-all border border-rose-500/20 flex items-center justify-center gap-2"
                            onclick="downloadActivePlaylist('no')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                                  stroke-linejoin="round" stroke-width="2"/>
                        </svg>
                        NO VOTES
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Level Status -->
    <div class="mb-10" id="activeLevelPanel">
        <!-- Will be populated by JS -->
        <div class="bg-brand-card border border-slate-800 rounded-2xl p-8 shadow-xl animate-pulse">
            <div class="h-8 bg-slate-800 rounded w-1/4 mb-4"></div>
            <div class="h-4 bg-slate-800 rounded w-1/2"></div>
        </div>
    </div>

    <!-- Sessions List -->
    <div>
        <h3 class="text-2xl font-black mb-6 flex items-center gap-2">
            All Sessions
            <span class="text-sm font-normal text-brand-muted bg-slate-800 px-2 py-0.5 rounded-md"
                  id="sessionCount">0</span>
        </h3>
        <div class="space-y-4" id="sessionsContainer">
            <!-- Will be populated by JS -->
        </div>
    </div>
</div>

<div class="extra-slot">
    <!-- New Session Modal -->
    <div aria-labelledby="modal-title" aria-modal="true" class="hidden fixed inset-0 z-[60] overflow-y-auto"
         id="newSessionModal" role="dialog">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div aria-hidden="true" class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm transition-opacity"
                 id="modalBackdrop"></div>
            <span aria-hidden="true" class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-brand-card border border-slate-800 rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="p-8">
                    <h3 class="text-2xl font-black mb-6" id="modal-title">New Session</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Display
                                Name</label>
                            <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent/30 transition-all"
                                   id="newSessionName" placeholder="My Awesome Stream" required
                                   type="text">
                        </div>
                        <div class="pt-4 border-t border-slate-800">
                            <label class="flex items-center gap-2 cursor-pointer group mb-4">
                                <input class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-brand-accent focus:ring-brand-accent focus:ring-offset-0"
                                       id="newSessionPlaylistMode"
                                       onchange="document.getElementById('playlistConfigSection').classList.toggle('hidden', !this.checked)"
                                       type="checkbox">
                                <span class="text-sm font-bold text-slate-400 group-hover:text-white transition-colors">Playlist Mode</span>
                            </label>

                            <div class="space-y-4 hidden" id="playlistConfigSection">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Initial Playlist
                                        (.zeeplist)</label>
                                    <input accept=".zeeplist,application/json"
                                           class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2"
                                           id="newSessionPlaylistFile"
                                           type="file">
                                    <p class="text-[10px] text-slate-500 mt-1 uppercase font-bold">Hint: Session name will match playlist
                                        name</p>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Round Length
                                        (Seconds)</label>
                                    <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent transition-all"
                                           id="newSessionRoundLength"
                                           step="1"
                                           type="number"
                                           value="300">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 flex gap-3">
                        <button class="flex-1 px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all border border-slate-700"
                                id="cancelModalBtn"
                                type="button">
                            Cancel
                        </button>
                        <button class="flex-1 px-4 py-3 bg-brand-accent text-brand-dark hover:bg-brand-accent/80 rounded-xl font-bold transition-all shadow-lg shadow-brand-accent/20"
                                id="submitCreateSessionBtn"
                                type="button">
                            Create
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // --- State ---
        const isOwner = /*[[${isOwner}]]*/ false;
        const isLoggedIn = /*[[${loggedIn}]]*/ false;
        const expandedSessions = new Set();
        const expandedLevels = new Set();
        let currentViewHostId = /*[[${host.id}]]*/ null;
        let stompClient = null;

        // --- Initialization ---
        $(document).ready(function () {
            console.log('Dashboard initialized');

            initWebSocket();

            $('#newSessionBtn').on('click', openModal);
            $('#cancelModalBtn, #modalBackdrop').on('click', closeModal);
            $('#submitCreateSessionBtn').on('click', createNewSession);

            $('#newSessionPlaylistFile').on('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        try {
                            const zeeplist = JSON.parse(e.target.result);
                            if (zeeplist.name && !$('#newSessionName').val()) {
                                $('#newSessionName').val(zeeplist.name);
                            }
                        } catch (err) {
                        }
                    };
                    reader.readAsText(file);
                }
            });

            // Global delegate for dynamic elements
            $(document).on('click', '[data-session-toggle]', function () {
                toggleSession($(this).data('session-toggle'));
            });

            $(document).on('click', '[data-level-toggle]', function () {
                toggleLevel($(this).data('level-toggle'));
            });

            // Initial load
            fetchDashboardData();
        });

        function initWebSocket() {
            const socket = new SockJS('/ws-dashboard');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                $('#wsStatus').removeClass('text-slate-500').addClass('text-brand-accent');

                // Subscribe to host updates
                const hostId = /*[[${host.id}]]*/ null;
                if (hostId) {
                    stompClient.subscribe('/topic/dashboard/' + hostId, function () {
                        fetchDashboardData();
                    });
                }

                // Global updates (new hosts, etc)
                stompClient.subscribe('/topic/dashboard/global', function () {
                    if (!isLoggedIn && !currentViewHostId) {
                        // Refresh host list if on main guest page
                        location.reload();
                    } else if (currentViewHostId || isLoggedIn) {
                        fetchDashboardData();
                    }
                });
            }, function (error) {
                console.warn('WebSocket connection failed, retrying in 5s...');
                $('#wsStatus').removeClass('text-brand-accent animate-pulse').addClass('text-slate-500');
                setTimeout(initWebSocket, 5000);
            });
        }


        function openModal() {
            $('#newSessionModal').removeClass('hidden');
            $('#newSessionName').val('').focus();
        }

        function closeModal() {
            $('#newSessionModal').addClass('hidden');
        }

        function fetchDashboardData() {
            console.log('Fetching dashboard data...');
            let url = '/api/playlistvoting/dashboard';
            if (currentViewHostId) {
                url += '?hostId=' + currentViewHostId;
            }

            $.ajax({
                url: url,
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    renderDashboard(data);
                },
                error: function (xhr) {
                    if (xhr.status === 401 && isLoggedIn) {
                        window.location.href = '/login';
                    } else {
                        showError('Failed to fetch dashboard data (Status: ' + xhr.status + ')');
                    }
                }
            });
        }

        function showError(message) {
            $('#sessionsContainer').html(`
                <div class="bg-red-500/10 border border-red-500/50 rounded-2xl p-8 text-center">
                    <h4 class="text-red-500 font-bold mb-2">Error</h4>
                    <p class="text-slate-400 text-sm">${message}</p>
                    <button id="retryBtn" class="mt-4 px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold">Retry</button>
                </div>
            `);
            $('#retryBtn').on('click', fetchDashboardData);
        }

        function renderDashboard(data) {
            renderActiveLevel(data.currentLevel, data.currentVotes, data.activeSessionName, data.lobbyTimer, data.playlistMode, data.currentVeto);
            renderSessions(data.sessions);

            if (isOwner && data.activeSessionName) {
                $('#playlistPanel').removeClass('hidden');
                $('#playlistModeCheckbox').prop('checked', data.playlistMode);
            } else {
                $('#playlistPanel').addClass('hidden');
            }
        }

        function renderActiveLevel(level, votes, activeSessionName, lobbyTimer, playlistMode, currentVeto) {
            const $panel = $('#activeLevelPanel');
            if (!$panel.length) return;

            if (!activeSessionName) {
                $panel.html(`
                    <div class="bg-brand-card border border-slate-800 rounded-2xl p-8 shadow-xl text-center">
                        <p class="text-brand-muted font-bold uppercase tracking-widest text-xs mb-2">Active Session</p>
                        <h2 class="text-2xl font-black text-slate-500">NO ACTIVE SESSION</h2>
                        <p class="text-slate-600 text-xs mt-2 italic">${isLoggedIn ? 'Activate a session below to start voting' : 'Host is currently offline'}</p>
                    </div>
                `);
                return;
            }

            if (!level) {
                $panel.html(`
                    <div class="bg-brand-card border border-slate-800 rounded-2xl p-8 shadow-xl text-center">
                        <div class="flex flex-col items-center">
                            <p class="text-brand-accent font-bold uppercase tracking-widest text-xs mb-1">Active Session: ${activeSessionName}</p>
                            <div class="h-px w-24 bg-brand-accent/20 mb-4"></div>
                            <h2 class="text-2xl font-black text-slate-500 uppercase">No active map</h2>
                            <p class="text-slate-600 text-xs mt-2 italic">Waiting for host to start a vote</p>
                        </div>
                    </div>
                `);
                return;
            }

            const voteHtml = votes ? `
                <div class="mt-8">
                    <div class="flex justify-between items-end mb-2">
                        <div class="flex gap-4">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-green-400 uppercase tracking-widest">Yes</span>
                                <span class="text-2xl font-black">${votes.yes}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-red-400 uppercase tracking-widest">No</span>
                                <span class="text-2xl font-black">${votes.no}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Abstain</span>
                                <span class="text-2xl font-black">${votes.abstain}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-black text-brand-accent uppercase tracking-widest">Total Votes</span>
                            <p class="text-2xl font-black">${votes.total}</p>
                        </div>
                    </div>
                    
                    <div class="h-4 w-full bg-slate-800 rounded-full overflow-hidden flex shadow-inner">
                        <div class="h-full bg-green-500 transition-all duration-500 ease-out" style="width: ${votes.total > 0 ? (votes.yes / votes.total * 100) : 0}%"></div>
                        <div class="h-full bg-red-500 transition-all duration-500 ease-out" style="width: ${votes.total > 0 ? (votes.no / votes.total * 100) : 0}%"></div>
                        <div class="h-full bg-white transition-all duration-500 ease-out" style="width: ${votes.total > 0 ? (votes.abstain / votes.total * 100) : 0}%"></div>
                    </div>
                    
                    <div class="mt-4 flex justify-center">
                         <div class="bg-brand-accent/10 border border-brand-accent/20 px-4 py-2 rounded-xl">
                            <span class="text-brand-accent font-black text-xl">${votes.yesPct}% YES</span>
                         </div>
                    </div>
                </div>
            ` : '';

            $panel.html(`
                <div class="bg-brand-card border-2 border-brand-accent/30 rounded-2xl p-8 shadow-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                        <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <div class="mb-4 flex justify-between items-start">
                        <div>
                            <p class="text-brand-muted font-bold uppercase tracking-widest text-[10px] mb-1">Active Session</p>
                            <h3 class="text-xl font-black text-white">${activeSessionName}</h3>
                        </div>
                        <div class="text-right">
                            <p class="text-brand-muted font-bold uppercase tracking-widest text-[10px] mb-1">Lobby Timer</p>
                            <h3 class="text-2xl font-black text-brand-accent">${lobbyTimer || '0:00'}</h3>
                        </div>
                    </div>
                    <div class="h-px w-full bg-slate-800 mb-6"></div>
                    <p class="text-brand-accent font-bold uppercase tracking-widest text-xs mb-2 flex items-center gap-2">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-accent"></span>
                        </span>
                        Active Level
                    </p>
                    <h2 class="text-4xl font-black mb-1 truncate">${level.name}</h2>
                    <p class="text-brand-muted font-bold text-lg">by ${level.author}</p>
                    ${level.workshopID ? `<a href="https://steamcommunity.com/sharedfiles/filedetails/?id=${level.workshopID}" target="_blank" class="text-steam-accent hover:underline text-[10px] block mt-1">Steam Workshop</a>` : ''}
                    ${voteHtml}
                    
                    ${isOwner ? `
                    <div class="mt-8 pt-8 border-t border-slate-800">
                        <div class="flex flex-col sm:flex-row items-center gap-4">
                            <span class="text-[10px] font-black text-brand-muted uppercase tracking-widest">Host Veto</span>
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="castVeto('${level.uid}', 'YES')" class="flex-1 sm:flex-initial px-4 py-2 bg-green-600/20 hover:bg-green-600 text-green-400 hover:text-white border border-green-600/30 rounded-lg text-xs font-bold transition-all ${currentVeto === 'YES' ? 'bg-green-600 text-white ring-2 ring-green-400 ring-offset-2 ring-offset-brand-dark' : ''}">VETO YES</button>
                                <button onclick="castVeto('${level.uid}', 'NO')" class="flex-1 sm:flex-initial px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/30 rounded-lg text-xs font-bold transition-all ${currentVeto === 'NO' ? 'bg-red-600 text-white ring-2 ring-red-400 ring-offset-2 ring-offset-brand-dark' : ''}">VETO NO</button>
                                <button onclick="castVeto('${level.uid}', null)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-lg text-xs font-bold transition-all">CLEAR</button>
                            </div>
                            ${currentVeto ? `<span class="text-xs font-bold text-brand-accent animate-pulse uppercase">Vetoed: ${currentVeto}</span>` : ''}
                        </div>
                    </div>
                    ` : (currentVeto ? `
                    <div class="mt-6 p-4 bg-brand-accent/5 border border-brand-accent/20 rounded-xl text-center">
                        <span class="text-xs font-bold text-brand-accent uppercase tracking-widest">Host has vetoed this level: ${currentVeto}</span>
                    </div>
                    ` : '')}
                    
                    ${isLoggedIn ? `
                        <div class="mt-8 flex gap-4">
                            <button onclick="castDashboardVote('YES')" class="flex-1 py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl font-black text-xl transition-all shadow-lg shadow-green-500/20 flex items-center justify-center gap-2 transform active:scale-95">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                                YES
                            </button>
                            <button onclick="castDashboardVote('NO')" class="flex-1 py-4 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-black text-xl transition-all shadow-lg shadow-red-500/20 flex items-center justify-center gap-2 transform active:scale-95">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
                                NO
                            </button>
                        </div>
                        <div class="mt-4 flex justify-center">
                            <button onclick="castDashboardVote('REMOVE')" class="text-slate-500 hover:text-slate-300 text-[10px] font-black uppercase tracking-widest transition-colors">
                                Remove my vote
                            </button>
                        </div>
                    ` : ''}
                </div>
            `);
        }

        function renderSessions(sessions) {
            $('#sessionCount').text(sessions.length);
            const $container = $('#sessionsContainer');

            if (sessions.length === 0) {
                $container.html(`
                    <div class="bg-brand-card/30 border-2 border-dashed border-slate-800 rounded-3xl p-12 text-center">
                        <h4 class="text-xl font-black mb-3 text-slate-500">No sessions found</h4>
                    </div>
                `);
                return;
            }

            const html = sessions.map(session => {
                const isExpanded = expandedSessions.has(session.id);
                const isActive = session.state === 'ACTIVE';
                const isPaused = session.state === 'PAUSED';
                const isFinished = session.state === 'FINISHED';

                let actionsHtml = '';
                if (isOwner) {
                    actionsHtml = `
                        <div class="flex items-center gap-3">
                            <a href="/api/playlistvoting/sessions/${session.id}/playlist"
                               class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition-all border border-slate-700 flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                DOWNLOAD .ZEEPLIST
                            </a>
                            
                            <div class="flex bg-slate-900/50 rounded-xl p-1 border border-slate-800">
                                <button onclick="renameSession('${session.id}', '${session.name}')"
                                        class="p-2 hover:bg-slate-800 text-slate-500 hover:text-brand-accent rounded-lg transition-colors"
                                        title="Rename">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                
                                ${!isFinished ? `
                                    <button onclick="updateState('${session.id}', '${isActive ? 'PAUSED' : 'ACTIVE'}')" 
                                            class="p-2 hover:bg-slate-800 rounded-lg transition-colors ${isActive ? 'text-yellow-500' : 'text-green-500'}"
                                            title="${isActive ? 'Pause' : 'Start'}">
                                        ${isActive ?
                        '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' :
                        '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
                                    </button>
                                    <button onclick="updateState('${session.id}', 'FINISHED')" 
                                            class="p-2 hover:bg-slate-800 text-slate-500 hover:text-red-500 rounded-lg transition-colors"
                                            title="Finish Session">
                                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-2 10H7v-2h10v2z"/></svg>
                                    </button>
                                ` : `
                                    <button onclick="updateState('${session.id}', 'ACTIVE')" 
                                            class="p-2 hover:bg-slate-800 text-green-500 rounded-lg transition-colors"
                                            title="Reopen Session">
                                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                                    </button>
                                `}
                                
                                <button onclick="resetVotes('${session.id}')"
                                        class="p-2 hover:bg-slate-800 text-slate-500 hover:text-orange-500 rounded-lg transition-colors"
                                        title="Reset All Votes">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                
                                <button onclick="deleteSession('${session.id}')" 
                                        class="p-2 hover:bg-red-500/10 text-slate-500 hover:text-red-500 rounded-lg transition-colors"
                                        title="Delete Session">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                            </div>
                            
                            <button data-session-toggle="${session.id}" class="p-2 text-slate-500 hover:text-white transition-transform ${isExpanded ? 'rotate-180' : ''}">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    `;
                } else {
                    actionsHtml = `
                        <div class="flex items-center gap-3">
                             <button data-session-toggle="${session.id}" class="p-2 text-slate-500 hover:text-white transition-transform ${isExpanded ? 'rotate-180' : ''}">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    `;
                }

                return `
                    <div class="bg-brand-card border ${isActive ? 'border-brand-accent/50 shadow-brand-accent/5' : 'border-slate-800'} rounded-2xl overflow-hidden transition-all shadow-lg ${isFinished ? 'opacity-75' : ''}">
                        <div class="p-6 flex items-center justify-between">
                            <div class="flex-1 cursor-pointer" data-session-toggle="${session.id}">
                                <div class="flex items-center gap-3 mb-1">
                                    <h4 class="text-xl font-black ${isFinished ? 'line-through text-slate-500' : ''}">${session.name}</h4>
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${isActive ? 'bg-green-500/10 text-green-400 border border-green-500/20' : (isFinished ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700')}">
                                        ${session.state}
                                    </span>
                                </div>
                                <p class="text-xs text-brand-muted font-bold uppercase tracking-tighter">
                                    ${session.levels.length} Levels • Created on ${new Date(session.createdAt).toLocaleDateString()}
                                </p>
                            </div>
                            
                            ${actionsHtml}
                        </div>
                        
                        ${isExpanded ? `
                            <div class="border-t border-slate-800 bg-slate-900/30 p-6 space-y-3">
                                ${session.levels.length === 0 ? '<p class="text-center py-8 text-brand-muted font-bold italic">No levels in this session yet.</p>' : ''}
                                ${session.levels.map(level => renderLevelCard(session.id, level)).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            $container.html(html);
        }

        function renderLevelCard(sessionId, level) {
            const levelId = `${sessionId}_${level.uid}`;
            const isExpanded = expandedLevels.has(levelId);

            return `
                <div class="bg-brand-card border border-slate-800 rounded-xl overflow-hidden transition-all">
                        <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-800/50" data-level-toggle="${levelId}">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <h5 class="font-bold">${level.name}</h5>
                                    <span class="text-[10px] text-brand-muted">by ${level.author}</span>
                                    ${level.isCurrent ? '<span class="bg-brand-accent/20 text-brand-accent text-[9px] px-1.5 py-0.5 rounded font-black uppercase">CURRENT</span>' : ''}
                                    ${level.status === 'VOTING_FINISHED' ? '<span class="bg-slate-700/50 text-slate-400 text-[9px] px-1.5 py-0.5 rounded font-black uppercase">Voting Finished</span>' : ''}
                                    ${level.veto ? `<span class="bg-${level.veto === 'YES' ? 'green' : 'red'}-600/30 text-${level.veto === 'YES' ? 'green' : 'red'}-400 text-[9px] px-1.5 py-0.5 rounded font-black uppercase border border-${level.veto === 'YES' ? 'green' : 'red'}-600/50">VETO: ${level.veto}</span>` : ''}
                                    ${level.workshopID ? `<a href="https://steamcommunity.com/sharedfiles/filedetails/?id=${level.workshopID}" target="_blank" class="text-steam-accent hover:underline text-[10px]" onclick="event.stopPropagation()">Steam Workshop</a>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-6">
                            <div class="flex gap-4 text-xs font-black">
                                <span class="text-green-400">${level.yes} Y</span>
                                <span class="text-red-400">${level.no} N</span>
                                <span class="text-slate-400">${level.abstain} A</span>
                            </div>
                            <div class="w-24 h-2 bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full bg-brand-accent" style="width: ${level.yesPct}%"></div>
                            </div>
                            <svg class="w-4 h-4 text-slate-500 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>
                    
                    ${isExpanded ? `
                        <div class="p-4 bg-slate-900/50 border-t border-slate-800">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="text-brand-muted font-bold uppercase tracking-tighter border-b border-slate-800">
                                        <th class="pb-2">Time</th>
                                        <th class="pb-2">User ID</th>
                                        <th class="pb-2">Name</th>
                                        <th class="pb-2">Platform</th>
                                        <th class="pb-2 text-right">Vote</th>
                                        ${isOwner ? '<th class="pb-2 text-right">Action</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/50">
                                    ${level.votes.map(v => `
                                        <tr>
                                            <td class="py-2 text-slate-500 text-[10px]">${v.timestamp ? new Date(v.timestamp).toLocaleTimeString() : '-'}</td>
                                            <td class="py-2 text-slate-500 font-mono text-[10px]">${v.user}</td>
                                            <td class="py-2 font-bold">${v.username}</td>
                                            <td class="py-2">
                                                <span class="px-1.5 py-0.5 bg-slate-800 rounded text-[9px]">${v.platform}</span>
                                            </td>
                                            <td class="py-2 text-right">
                                                <span class="font-black ${v.vote === 'YES' ? 'text-green-400' : (v.vote === 'NO' ? 'text-red-400' : 'text-slate-400')}">${v.vote}</span>
                                            </td>
                                            ${isOwner ? `
                                                <td class="py-2 text-right">
                                                    <button onclick="deleteVote('${v.id}')" class="text-slate-500 hover:text-red-500 transition-colors">
                                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                                    </button>
                                                </td>
                                            ` : ''}
                                        </tr>
                                    `).join('')}
                                    ${level.votes.length === 0 ? '<tr><td colspan="' + (isOwner ? '6' : '5') + '" class="py-4 text-center text-brand-muted italic">No votes yet.</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleSession(id) {
            if (expandedSessions.has(id)) expandedSessions.delete(id);
            else expandedSessions.add(id);
            fetchDashboardData();
        }

        function toggleLevel(id) {
            if (expandedLevels.has(id)) expandedLevels.delete(id);
            else expandedLevels.add(id);
            fetchDashboardData();
        }

        function updateState(id, state) {
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/state`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({state: state}),
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to update session state');
                }
            });
        }

        function renameSession(id, currentName) {
            const newName = prompt('Enter new session name:', currentName);
            if (newName === null || newName === currentName || newName.trim() === '') return;

            $.ajax({
                url: `/api/playlistvoting/sessions/${id}`,
                method: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({name: newName}),
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to rename session');
                }
            });
        }

        function deleteSession(id) {
            if (!confirm('Really delete session?')) return;
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to delete session');
                }
            });
        }

        function resetVotes(id) {
            if (!confirm('Really reset ALL votes for this session? This cannot be undone.')) return;
            $.ajax({
                url: `/api/playlistvoting/sessions/${id}/votes`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to reset votes');
                }
            });
        }

        function deleteVote(voteId) {
            if (!confirm('Remove this vote?')) return;
            $.ajax({
                url: `/api/playlistvoting/votes/${voteId}`,
                method: 'DELETE',
                success: fetchDashboardData,
                error: function () {
                    alert('Failed to delete vote');
                }
            });
        }

        function castDashboardVote(option) {
            $.ajax({
                url: '/api/playlistvoting/dashboard/votes',
                method: 'POST',
                data: {
                    hostId: currentViewHostId,
                    vote: option
                },
                success: function (result) {
                    console.log('Vote cast:', result);
                    // UI update via WebSocket
                },
                error: function (xhr) {
                    alert('Failed to cast vote: ' + xhr.responseText);
                }
            });
        }

        function createNewSession() {
            const name = $('#newSessionName').val();
            const playlistMode = $('#newSessionPlaylistMode').prop('checked');
            const roundLength = parseFloat($('#newSessionRoundLength').val()) || 300;
            const fileInput = document.getElementById('newSessionPlaylistFile');

            if (!name) {
                alert('Please enter a session name');
                return;
            }

            const sendRequest = (zeeplistData) => {
                $.ajax({
                    url: '/api/playlistvoting/sessions',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        name: name,
                        playlistMode: playlistMode,
                        roundLength: roundLength,
                        zeeplist: zeeplistData
                    }),
                    success: function () {
                        closeModal();
                        fetchDashboardData();
                    },
                    error: function (xhr) {
                        let msg = 'Failed to create session';
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data.message) msg += ': ' + data.message;
                        } catch (e) {
                        }
                        alert(msg);
                    }
                });
            };

            if (playlistMode && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const zeeplist = JSON.parse(e.target.result);
                        sendRequest(zeeplist);
                    } catch (err) {
                        alert('Error parsing .zeeplist file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            } else {
                sendRequest(null);
            }
        }

        function castVeto(uid, veto) {
            $.ajax({
                url: '/api/playlistvoting/sessions/active/veto',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({uid: uid, veto: veto}),
                error: function (xhr) {
                    alert('Veto failed: ' + xhr.responseText);
                }
            });
        }

        function updatePlaylist() {
            const fileInput = document.getElementById('zeeplistFileUpload');
            const mode = $('#playlistModeCheckbox').prop('checked');

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const zeeplist = JSON.parse(e.target.result);
                        sendPlaylistUpdate({
                            zeeplist: zeeplist,
                            playlistMode: mode
                        });
                        fileInput.value = ''; // Reset file input
                    } catch (err) {
                        alert('Error parsing .zeeplist file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            } else {
                sendPlaylistUpdate({
                    playlistMode: mode
                });
            }
        }

        function sendPlaylistUpdate(data) {
            $.ajax({
                url: '/api/playlistvoting/sessions/active/playlist',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function () {
                    // Feedback handled by WebSocket
                    $('#playlistInput').val(''); // Clear manual input on success
                },
                error: function (xhr) {
                    alert('Update playlist failed: ' + xhr.responseText);
                }
            });
        }

        function downloadActivePlaylist(type) {
            if (!currentData || !currentData.sessions) return;
            const activeSession = currentData.sessions.find(s => s.displayName === currentData.activeSessionName);
            if (!activeSession) {
                alert("No active session found to download.");
                return;
            }
            window.location.href = `/api/playlistvoting/sessions/${activeSession.id}/playlist?type=${type}`;
        }

    </script>
</div>

</body>
</html>
