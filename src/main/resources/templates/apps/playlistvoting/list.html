<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Playlist Voting - Hosts')}"></head>
<body th:replace="~{layout/main-layout :: layout('Hosts', ~{:: .content-slot}, _)}">

<div class="content-slot w-full">
    <!-- Header Section -->
    <div class="text-center mb-12 animate-in fade-in slide-in-from-bottom-4 duration-700">
        <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight text-white">
            Playlist Voting <span class="text-brand-accent">Hosts</span>
        </h1>
        <p class="text-brand-muted max-w-2xl mx-auto leading-relaxed">
            Select a host to view their active voting session and participate.
        </p>
    </div>

    <!-- Error Messages -->
    <div class="max-w-full mx-auto px-4 mb-12" th:if="${param.error}">
        <div class="bg-red-500/10 border border-red-500/50 text-red-500 px-6 py-4 rounded-2xl flex items-center gap-3 animate-in fade-in shake-in duration-500">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2"/>
            </svg>
            <span th:if="${param.error[0] == 'host_not_found'}">The requested host was not found.</span>
            <span th:unless="${param.error[0] == 'host_not_found'}">An error occurred. Please try again.</span>
        </div>
    </div>

    <!-- Stats / Gimmick -->
    <div class="flex justify-center mb-12 animate-in fade-in zoom-in duration-1000">
        <div class="bg-brand-card/50 border border-slate-800 rounded-2xl px-8 py-4 flex items-center gap-6 shadow-xl">
            <div class="flex flex-col">
                <span class="text-3xl font-black text-brand-accent" th:text="${activeSessionsCount}">0</span>
                <span class="text-xs uppercase tracking-wider text-slate-500 font-bold">Active Sessions</span>
            </div>
            <div class="w-px h-10 bg-slate-800"></div>
            <div class="flex flex-col">
                <span class="text-3xl font-black text-white" th:text="${hosts.size()}">0</span>
                <span class="text-xs uppercase tracking-wider text-slate-500 font-bold">Total Hosts</span>
            </div>
        </div>
    </div>

    <!-- Hosts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 px-4 max-w-full mx-auto">
        <div class="group bg-brand-card border border-slate-800 rounded-2xl p-6 hover:border-brand-accent/40 transition-all hover:shadow-2xl hover:shadow-brand-accent/5 relative overflow-hidden"
             th:each="host : ${hosts}">

            <div class="flex items-center gap-4 mb-6 relative z-10">
                <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center border-2 border-slate-700 group-hover:border-brand-accent/50 transition-colors overflow-hidden">
                    <img class="w-full h-full object-cover" th:alt="${host.displayName}" th:if="${host.avatarUrl != null}"
                         th:src="${host.avatarUrl}">
                    <svg class="w-6 h-6 text-slate-400 group-hover:text-brand-accent" fill="none" stroke="currentColor"
                         th:unless="${host.avatarUrl != null}" viewBox="0 0 24 24">
                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                              stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white group-hover:text-brand-accent transition-colors" th:text="${host.displayName}">
                        Host Name</h3>
                    <p class="text-xs text-slate-500 font-mono" th:text="${host.steamId}">76561198000000000</p>
                </div>
            </div>

            <div class="space-y-3 mb-6 relative z-10">
                <div class="flex items-center gap-2 text-sm" th:if="${host.activeSession != null}">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-slate-300 font-medium" th:text="${host.activeSession.displayName}">Active Session Name</span>
                </div>
                <div class="flex items-center gap-2 text-sm text-slate-600" th:unless="${host.activeSession != null}">
                    <span class="h-2 w-2 rounded-full bg-slate-800"></span>
                    <span>No active session</span>
                </div>

                <div class="text-xs text-slate-500 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                              stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                    <span th:text="${host.sessionCount + ' sessions total'}">12 sessions total</span>
                </div>
            </div>

            <a class="block w-full text-center py-2.5 rounded-xl bg-slate-800 hover:bg-brand-accent text-white text-sm font-bold transition-all relative z-10"
               th:href="@{/playlistvoting/{id}(id=${host.steamId})}">
                View Dashboard
            </a>

            <!-- Gimmick Background Icon -->
            <div class="absolute -bottom-4 -right-4 opacity-5 group-hover:opacity-10 transition-opacity transform group-hover:scale-110 duration-500">
                <svg class="w-32 h-32 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                          stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
            </div>
        </div>
    </div>
</div>

</body>
</html>
