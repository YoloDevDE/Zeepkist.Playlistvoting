<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Login')}"></head>
<body th:replace="~{layout/main-layout :: layout('Login', ~{:: .content-slot}, _)}">

<div class="content-slot w-full max-w-md mx-auto">
    <div class="bg-brand-card border border-slate-800 rounded-3xl p-10 shadow-2xl relative overflow-hidden">
        <!-- Glow effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-accent/10 blur-3xl rounded-full"></div>

        <div class="text-center mb-10">
            <h1 class="text-3xl font-black mb-2 tracking-tight">Welcome back</h1>
            <p class="text-brand-muted text-sm">Log in to continue</p>
        </div>

        <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-xs mb-8 flex items-center gap-3"
             th:if="${param.error}">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path clip-rule="evenodd"
                      d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                      fill-rule="evenodd"/>
            </svg>
            Invalid credentials. Please try again.
        </div>

        <form class="space-y-6" method="post" th:action="@{/login}">
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Username (Email)</label>
                <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent/30 transition-all"
                       name="username"
                       placeholder="yolo@example.com"
                       required type="text">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Password</label>
                <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent/30 transition-all"
                       name="password"
                       placeholder="••••••••"
                       required type="password">
            </div>

            <button class="w-full bg-brand-accent text-brand-dark font-bold py-4 rounded-xl hover:bg-brand-accent/80 transition-all shadow-lg shadow-brand-accent/20"
                    type="submit">
                Login
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-800"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-brand-card px-4 text-brand-muted">Or continue with</span>
            </div>
        </div>

        <a class="w-full flex items-center justify-center gap-3 bg-[#171a21] text-white font-bold py-4 rounded-xl hover:bg-[#1b2838] transition-all border border-slate-700"
           href="/auth/steam">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.654c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.83-4.093V9.01c0-2.503 2.029-4.531 4.531-4.531 2.503 0 4.532 2.028 4.532 4.531 0 2.503-2.029 4.532-4.532 4.532-.063 0-.125-.005-.188-.007l-4.093 2.83h-.004c0 .708-.218 1.366-.59 1.912l2.654 6.432C19.14 23.489 24 18.322 24 12.021 24 5.382 18.618 0 11.979 0zM7.544 14.504a1.884 1.884 0 1 1-1.883 1.884 1.883 1.883 0 0 1 1.883-1.884zM16.91 9.01a2.378 2.378 0 1 1-2.378-2.379A2.378 2.378 0 0 1 16.91 9.01zm-3.824 5.158l3.414-2.361c.021.006.042.013.064.013a2.378 2.378 0 0 0 0-4.756 2.378 2.378 0 0 0 0 4.756c.022 0 .043-.007.064-.013l2.361 3.414a4.531 4.531 0 0 1-5.903-1.053z"/>
            </svg>
            Sign in with Steam
        </a>

        <div class="mt-10 pt-8 border-t border-slate-800 text-center space-y-4">
            <p class="text-sm text-brand-muted">
                No account yet? <a
                    class="text-brand-accent hover:underline decoration-2 underline-offset-4 font-semibold"
                    href="/register">Register now</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
