<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Login')}"></head>
<body th:replace="~{layout/main-layout :: layout('Login', ~{:: .content-slot}, _)}">

<div class="content-slot w-full max-w-md mx-auto">

        <div class="text-center mb-10">

            <p class="text-brand-muted text-sm">Sign in with your Steam account to continue</p>
        </div>

        <a class="w-full flex items-center justify-center gap-4 bg-gradient-to-b from-[#2a475e] to-[#1b2838] text-white font-bold py-5 rounded-2xl hover:from-[#325672] hover:to-[#203042] transition-all border border-[#66c0f4]/20 shadow-2xl shadow-black/40 group"
           href="/auth/steam">
            <svg aria-hidden="true" class="w-8 h-8 text-[#66c0f4] group-hover:scale-110 transition-transform flex-shrink-0"
                 fill="currentColor"
                 viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M11.979 0C5.678 0 .511 4.86.021 11.037l6.432 2.654c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.83-4.091V9.01c0-2.503 2.029-4.532 4.532-4.532 2.503 0 4.532 2.029 4.532 4.532 0 2.503-2.029 4.532-4.532 4.532-.063 0-.125-.004-.188-.006l-4.091 2.83v.005c0 .709-.219 1.367-.59 1.912l2.654 6.432C19.14 23.489 24 18.322 24 12.021 24 5.382 18.618 0 11.979 0zM6.393 14.51c-.608 0-1.102-.494-1.102-1.102 0-.608.494-1.102 1.102-1.102.608 0 1.102.494 1.102 1.102 0 .608-.494 1.102-1.102 1.102zm9.401-8.318c1.391 0 2.518 1.127 2.518 2.518s-1.127 2.518-2.518 2.518-2.518-1.127-2.518-2.518 1.127-2.518 2.518-2.518zm-3.824 5.157l3.414-2.361c.021.006.042.013.064.013a2.518 2.518 0 0 0 0-5.036 2.518 2.518 0 0 0 0 5.036c.022 0 .043-.007.064-.013l2.361 3.414a4.532 4.532 0 0 1-5.903-1.053z"/>

            <span class="text-xl">Sign in with Steam</span>
        </a>
    </div>
</div>

</body>
</html>
