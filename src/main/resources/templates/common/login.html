<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Login')}"></head>
<body th:replace="~{layout/main-layout :: layout('Login', ~{:: .content-slot}, _)}">

<div class="content-slot w-full max-w-md mx-auto">
    <div class="bg-brand-card border border-slate-800 rounded-3xl p-10 shadow-2xl relative overflow-hidden">
        <!-- Glow effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-accent/10 blur-3xl rounded-full"></div>

        <div class="text-center mb-10">
            <h1 class="text-3xl font-black mb-2 tracking-tight">Welcome</h1>
            <p class="text-brand-muted text-sm">Sign in with your Steam account to continue</p>
        </div>

        <a class="w-full flex items-center justify-center gap-4 bg-gradient-to-b from-[#2a475e] to-[#1b2838] text-white font-bold py-5 rounded-2xl hover:from-[#325672] hover:to-[#203042] transition-all border border-[#66c0f4]/20 shadow-2xl shadow-black/40 group"
           href="/auth/steam">
            <svg aria-hidden="true" class="w-8 h-8 text-[#66c0f4] group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M12 .003c-5.854 0-10.742 4.22-11.777 9.771l5.541 2.285c.47-.319 1.037-.508 1.649-.508.054 0 .108.003.162.005l2.441-3.53v-.009c0-2.158 1.75-3.908 3.908-3.908 2.158 0 3.908 1.75 3.908 3.908 0 2.158-1.75 3.908-3.908 3.908-.054 0-.108-.003-.162-.005l-3.53 2.441v.004c0 .612-.189 1.179-.508 1.649l2.288 5.544c4.664-.847 8.24-4.877 8.24-9.761 0-5.414-4.389-9.803-9.803-9.803zm-5.483 12.511a1.624 1.624 0 1 1-1.624 1.624 1.624 1.624 0 0 1 1.624-1.624zm8.107-7.23a2.051 2.051 0 1 1-2.051 2.051 2.051 2.051 0 0 1 2.051-2.051zm-3.298 4.448l2.944-2.036c.018.005.036.011.055.011a2.051 2.051 0 0 0 0-4.102 2.051 2.051 0 0 0 0 4.102c.019 0 .037-.006.055-.011l2.036 2.944a3.908 3.908 0 0 1-5.09-1.053z"/>
            </svg>
            <span class="text-xl">Sign in with Steam</span>
        </a>
    </div>
</div>

</body>
</html>
