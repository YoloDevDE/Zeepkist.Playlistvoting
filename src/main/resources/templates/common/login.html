<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Login')}"></head>
<body th:replace="~{layout/main-layout :: layout('Login', ~{:: .content-slot}, _)}">

<div class="content-slot w-full max-w-md mx-auto">
    <div class="bg-brand-card border border-slate-800 rounded-3xl p-10 shadow-2xl relative overflow-hidden">
        <!-- Glow effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-brand-accent/10 blur-3xl rounded-full"></div>

        <div class="text-center mb-10">
            <h1 class="text-3xl font-black mb-2 tracking-tight">Welcome</h1>
            <p class="text-brand-muted text-sm">Sign in with your Steam account to continue</p>
        </div>

        <a class="w-full flex items-center justify-center gap-3 bg-[#171a21] text-white font-bold py-5 rounded-xl hover:bg-[#1b2838] transition-all border border-slate-700 shadow-xl shadow-black/20"
           href="/auth/steam">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.654c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.83-4.093V9.01c0-2.503 2.029-4.531 4.531-4.531 2.503 0 4.532 2.028 4.532 4.531 0 2.503-2.029 4.532-4.532 4.532-.063 0-.125-.005-.188-.007l-4.093 2.83h-.004c0 .708-.218 1.366-.59 1.912l2.654 6.432C19.14 23.489 24 18.322 24 12.021 24 5.382 18.618 0 11.979 0zM7.544 14.504a1.884 1.884 0 1 1-1.883 1.884 1.883 1.883 0 0 1 1.883-1.884zM16.91 9.01a2.378 2.378 0 1 1-2.378-2.379A2.378 2.378 0 0 1 16.91 9.01zm-3.824 5.158l3.414-2.361c.021.006.042.013.064.013a2.378 2.378 0 0 0 0-4.756 2.378 2.378 0 0 0 0 4.756c.022 0 .043-.007.064-.013l2.361 3.414a4.531 4.531 0 0 1-5.903-1.053z"/>
            </svg>
            Sign in with Steam
        </a>
    </div>
</div>

</body>
</html>
