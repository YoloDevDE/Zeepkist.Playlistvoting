<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard – Zeepkist Playlist Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        steam: {
                            dark: '#1b2838',
                            mid: '#16202d',
                            card: '#1e2d3d',
                            border: '#2a475e',
                            accent: '#66c0f4',
                            muted: '#8f98a0'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-steam-dark min-h-screen text-gray-300 font-sans">

<!-- Navbar -->
<nav class="bg-steam-mid border-b border-steam-border px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
        <span class="text-white font-bold text-lg">Zeepkist Playlist Voting</span>
        <a class="text-steam-accent text-sm font-medium" href="/zeepkist/playlistvoting/dashboard">Dashboard</a>
        <a class="text-steam-muted hover:text-white text-sm transition-colors" href="/zeepkist/playlistvoting/profile">Profile</a>
    </div>
    <div class="flex items-center gap-4">
        <!-- Live indicator + toggle -->
        <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse" id="liveIndicator"></span>
            <span class="text-xs text-steam-muted" id="liveLabel">Live</span>
            <button class="relative inline-flex items-center w-9 h-5 rounded-full transition-colors duration-200 bg-green-600 ml-1 focus:outline-none"
                    id="liveToggle"
                    onclick="toggleLivePolling()"
                    title="Toggle live polling">
                <span class="inline-block w-3.5 h-3.5 bg-white rounded-full shadow transform transition-transform duration-200 translate-x-4"
                      id="liveToggleKnob"></span>
            </button>
        </div>
        <span class="text-xs text-steam-muted" id="lastUpdated"></span>
        <span class="text-sm text-steam-muted">Logged in as
            <span class="text-white font-semibold" th:text="${steamName}">Player</span>
        </span>
        <a class="text-xs text-steam-muted hover:text-red-400 transition-colors"
           href="/zeepkist/playlistvoting/auth/logout">Logout</a>
    </div>
</nav>

<!-- Playlist Download Modal -->
<div class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50" id="playlistModal">
    <div class="bg-steam-mid border border-steam-border rounded-lg p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
        <h2 class="text-white font-semibold text-lg">Download Playlist</h2>
        <div class="flex flex-col gap-1">
            <label class="text-steam-muted text-xs uppercase tracking-widest">Playlist Name</label>
            <input class="bg-steam-dark border border-steam-border rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-steam-accent"
                   id="modalPlaylistName" placeholder="Session name"
                   type="text"/>
        </div>
        <div class="flex flex-col gap-1">
            <label class="text-steam-muted text-xs uppercase tracking-widest">Round Length (seconds)</label>
            <input class="bg-steam-dark border border-steam-border rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-steam-accent"
                   id="modalRoundLength" max="3600" min="30" type="number"
                   value="360"/>
            <span class="text-xs text-steam-muted">Default: 360s (6 minutes)</span>
        </div>
        <div class="flex items-center gap-3">
            <input checked class="accent-steam-accent w-4 h-4" id="modalShuffle" type="checkbox"/>
            <label class="text-sm text-gray-300">Shuffle playlist</label>
        </div>
        <div class="flex gap-3 mt-2">
            <button class="flex-1 text-sm bg-steam-border text-gray-300 px-4 py-2 rounded hover:brightness-110 transition-all"
                    onclick="closePlaylistModal()">
                Cancel
            </button>
            <button class="flex-1 text-sm bg-steam-accent text-steam-dark font-semibold px-4 py-2 rounded hover:brightness-110 transition-all"
                    onclick="confirmDownload()">
                Download
            </button>
        </div>
    </div>
</div>

<main class="max-w-5xl mx-auto px-4 py-8 flex flex-col gap-8">

    <!-- Current Level + Live Votes -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

        <!-- Current Level -->
        <section class="bg-steam-mid border border-steam-border rounded-lg p-6 flex flex-col gap-2">
            <h2 class="text-steam-muted text-xs uppercase tracking-widest mb-1">Current Level</h2>
            <div id="currentLevelBlock">
                <span class="text-steam-muted italic text-sm">No level currently set.</span>
            </div>
            <!-- Workshop embed -->
            <div class="hidden mt-3" id="workshopEmbed">
                <iframe class="w-full rounded border border-steam-border" frameborder="0" height="190"
                        id="workshopFrame"
                        src=""></iframe>
            </div>
            <div class="mt-2 text-xs text-steam-muted">
                Local time: <span class="text-white font-mono" id="lobbyTime"></span>
            </div>
        </section>

        <!-- Live Votes -->
        <section class="bg-steam-mid border border-steam-border rounded-lg p-6 flex flex-col gap-3">
            <h2 class="text-steam-muted text-xs uppercase tracking-widest mb-1">Live Votes</h2>
            <div id="liveVotesBlock">
                <span class="text-steam-muted italic text-sm">No active vote.</span>
            </div>
        </section>
    </div>

    <!-- Create Session -->
    <section class="bg-steam-mid border border-steam-border rounded-lg p-6">
        <h2 class="text-steam-muted text-xs uppercase tracking-widest mb-4">Create New Session</h2>
        <form action="/zeepkist/playlistvoting/dashboard/session/create" class="flex gap-3" method="post">
            <input class="flex-1 bg-steam-dark border border-steam-border rounded px-4 py-2 text-white text-sm placeholder-steam-muted focus:outline-none focus:border-steam-accent"
                   name="name" placeholder="Session name…"
                   type="text"/>
            <button class="bg-steam-accent text-steam-dark font-semibold text-sm px-5 py-2 rounded hover:brightness-110 transition-all"
                    type="submit">
                Create
            </button>
        </form>
    </section>

    <!-- Sessions -->
    <section class="bg-steam-mid border border-steam-border rounded-lg p-6">
        <h2 class="text-steam-muted text-xs uppercase tracking-widest mb-4">Sessions</h2>
        <div class="flex flex-col gap-4" id="sessionsList">
            <span class="text-steam-muted italic text-sm">Loading…</span>
        </div>
    </section>

</main>

<script th:inline="javascript">
    const TOKEN = /*[[${token}]]*/ '';

    let livePollingEnabled = true;
    let pollingInterval = null;

    function toggleLivePolling() {
        livePollingEnabled = !livePollingEnabled;
        const btn = document.getElementById('liveToggle');
        const knob = document.getElementById('liveToggleKnob');
        const indicator = document.getElementById('liveIndicator');
        const label = document.getElementById('liveLabel');

        if (livePollingEnabled) {
            btn.classList.remove('bg-steam-border');
            btn.classList.add('bg-green-600');
            knob.classList.remove('translate-x-0.5');
            knob.classList.add('translate-x-4');
            indicator.className = 'inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse';
            label.textContent = 'Live';
            pollingInterval = setInterval(fetchLiveData, 3000);
            fetchLiveData();
        } else {
            btn.classList.remove('bg-green-600');
            btn.classList.add('bg-steam-border');
            knob.classList.remove('translate-x-4');
            knob.classList.add('translate-x-0.5');
            indicator.className = 'inline-block w-2 h-2 rounded-full bg-steam-muted';
            label.textContent = 'Paused';
            clearInterval(pollingInterval);
        }
    }

    // --- Lobby time ---
    function updateLobbyTime() {
        document.getElementById('lobbyTime').textContent = new Date().toLocaleTimeString();
    }

    setInterval(updateLobbyTime, 1000);
    updateLobbyTime();

    // --- Accordion state persistence ---
    function getOpenSections() {
        try {
            return JSON.parse(sessionStorage.getItem('openSections') || '{}');
        } catch {
            return {};
        }
    }

    function setOpenSections(obj) {
        sessionStorage.setItem('openSections', JSON.stringify(obj));
    }

    function toggleLevel(key) {
        const el = document.getElementById('sec-' + key);
        const chevron = document.getElementById('chev-' + key);
        if (!el) return;
        const open = getOpenSections();
        const isOpen = !el.classList.contains('hidden');
        if (isOpen) {
            el.classList.add('hidden');
            chevron.classList.remove('rotate-90');
            delete open[key];
        } else {
            el.classList.remove('hidden');
            chevron.classList.add('rotate-90');
            open[key] = true;
        }
        setOpenSections(open);
    }

    function applyOpenSections() {
        const open = getOpenSections();
        Object.keys(open).forEach(key => {
            const el = document.getElementById('sec-' + key);
            const chevron = document.getElementById('chev-' + key);
            if (el) {
                el.classList.remove('hidden');
            }
            if (chevron) {
                chevron.classList.add('rotate-90');
            }
        });
    }

    // --- Workshop embed (only update on level change) ---
    let lastWorkshopId = null;

    function updateWorkshopEmbed(level) {
        if (!level || !level.workshopID) {
            document.getElementById('workshopEmbed').classList.add('hidden');
            lastWorkshopId = null;
            return;
        }
        if (level.workshopID === lastWorkshopId) return; // no change
        lastWorkshopId = level.workshopID;
        const frame = document.getElementById('workshopFrame');
        frame.src = `https://store.steampowered.com/widget/${level.workshopID}/`;
        document.getElementById('workshopEmbed').classList.remove('hidden');
    }

    // --- Playlist modal ---
    let pendingDownloadId = null;
    let pendingDownloadSessionName = null;

    function openPlaylistModal(sessionId, sessionName) {
        pendingDownloadId = sessionId;
        pendingDownloadSessionName = sessionName;
        document.getElementById('modalPlaylistName').value = sessionName;
        document.getElementById('playlistModal').classList.remove('hidden');
    }

    function closePlaylistModal() {
        document.getElementById('playlistModal').classList.add('hidden');
        pendingDownloadId = null;
        pendingDownloadSessionName = null;
    }

    function confirmDownload() {
        if (!pendingDownloadId) return;
        const roundLength = document.getElementById('modalRoundLength').value;
        const shuffle = document.getElementById('modalShuffle').checked;
        const name = encodeURIComponent(document.getElementById('modalPlaylistName').value.trim() || pendingDownloadSessionName);
        window.location.href = `/zeepkist/playlistvoting/api/session/${pendingDownloadId}/playlist/download?roundLength=${roundLength}&shuffle=${shuffle}&name=${name}`;
        closePlaylistModal();
    }

    // --- Rendering ---
    function stateBadge(state) {
        const map = {
            ACTIVE: 'bg-green-900 text-green-400 border-green-700',
            PAUSED: 'bg-yellow-900 text-yellow-400 border-yellow-700',
            FINISHED: 'bg-gray-700 text-gray-400 border-gray-600'
        };
        return `<span class="text-xs px-2 py-0.5 rounded-full border ${map[state] || ''}">${state[0] + state.slice(1).toLowerCase()}</span>`;
    }

    function voteColor(vote) {
        if (vote === 'YES') return 'text-green-400';
        if (vote === 'NO') return 'text-red-400';
        return 'text-steam-muted';
    }

    function renderLiveVotes(cv) {
        if (!cv) return '<span class="text-steam-muted italic text-sm">No active vote.</span>';
        const total = cv.yes + cv.no + cv.abstain;
        const hasVotes = (cv.yes + cv.no) > 0;
        const yesPct = hasVotes ? Math.round(cv.yes * 100 / (cv.yes + cv.no)) : 0;
        const noPct = hasVotes ? 100 - yesPct : 0;

        const barHtml = hasVotes
            ? `<div class="h-2 bg-green-500 transition-all duration-500" style="width:${yesPct}%"></div>
               <div class="h-2 bg-red-600 transition-all duration-500" style="width:${noPct}%"></div>`
            : `<div class="h-2 bg-steam-border w-full"></div>`;

        return `
            <div class="flex gap-6 text-lg font-bold">
                <span class="text-green-400">${cv.yes} <span class="text-xs font-normal text-steam-muted">YES</span></span>
                <span class="text-red-400">${cv.no} <span class="text-xs font-normal text-steam-muted">NO</span></span>
                ${cv.abstain > 0 ? `<span class="text-steam-muted">${cv.abstain} <span class="text-xs font-normal">ABSTAIN</span></span>` : ''}
            </div>
            <div class="w-full bg-steam-dark rounded-full h-2 mt-2 overflow-hidden flex">
                ${barHtml}
            </div>
            <div class="flex justify-between text-xs text-steam-muted mt-1">
                <span class="text-green-400">${hasVotes ? yesPct + '% YES' : '—'}</span>
                <span class="text-red-400">${hasVotes ? noPct + '% NO' : '—'}</span>
                <span>Total: ${total}</span>
            </div>`;
    }

    function renderLevels(levels, sessionId) {
        if (!levels || levels.length === 0) return '<span class="text-steam-muted italic text-xs">No levels played yet.</span>';
        return levels.map((l) => {
            const key = sessionId + '-' + l.uid;
            const yesPct = l.yesPct;
            const noPct = 100 - yesPct;
            const isCurrentBadge = l.isCurrent
                ? '<span class="text-xs px-1.5 py-0.5 rounded bg-steam-accent text-steam-dark font-bold ml-2">Now</span>' : '';

            const individualRows = l.votes.map(v =>
                `<tr class="border-t border-steam-border">
                    <td class="py-1 px-3 text-xs text-steam-muted font-mono">${v.user}</td>
                    <td class="py-1 px-3 text-xs text-steam-muted">${v.platform}</td>
                    <td class="py-1 px-3 text-xs font-semibold ${voteColor(v.vote)}">${v.vote}</td>
                </tr>`
            ).join('');

            return `
            <div class="border border-steam-border rounded overflow-hidden">
                <button onclick="toggleLevel('${key}')"
                        class="w-full flex items-center justify-between px-4 py-3 bg-steam-dark hover:brightness-110 transition-all text-left">
                    <div class="flex items-center gap-2 min-w-0">
                        <svg xmlns="http://www.w3.org/2000/svg" id="chev-${key}" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3 shrink-0 transition-transform duration-200">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/>
                        </svg>
                        <span class="text-white text-sm font-medium truncate">${l.name}</span>
                        <span class="text-steam-muted text-xs truncate">by ${l.author}</span>
                        ${isCurrentBadge}
                    </div>
                    <div class="flex items-center gap-3 shrink-0 ml-3">
                        <span class="text-green-400 text-xs font-semibold">${l.yes} YES</span>
                        <span class="text-red-400 text-xs font-semibold">${l.no} NO</span>
                        ${l.abstain > 0 ? `<span class="text-steam-muted text-xs">${l.abstain} ABS</span>` : ''}
                        <span class="text-steam-muted text-xs">${yesPct}%</span>
                    </div>
                </button>
                <div id="sec-${key}" class="hidden px-4 pb-4 pt-2 bg-steam-mid">
                    <div class="w-full bg-steam-dark rounded-full h-1.5 mb-3 overflow-hidden flex">
                        <div class="h-1.5 bg-green-500" style="width:${yesPct}%"></div>
                        <div class="h-1.5 bg-red-600" style="width:${noPct}%"></div>
                    </div>
                    <div class="flex gap-4 text-xs mb-3">
                        <span class="text-green-400 font-semibold">${l.yes} YES</span>
                        <span class="text-red-400 font-semibold">${l.no} NO</span>
                        ${l.abstain > 0 ? `<span class="text-steam-muted">${l.abstain} Abstain</span>` : ''}
                        <span class="text-steam-muted ml-auto">Total: ${l.total} · <span class="text-green-400">${yesPct}% YES</span> vs <span class="text-red-400">${noPct}% NO</span></span>
                    </div>
                    ${l.votes.length > 0 ? `
                    <table class="w-full text-left">
                        <thead><tr class="text-steam-muted text-xs uppercase">
                            <th class="py-1 px-3">User</th>
                            <th class="py-1 px-3">Platform</th>
                            <th class="py-1 px-3">Vote</th>
                        </tr></thead>
                        <tbody>${individualRows}</tbody>
                    </table>` : '<span class="text-steam-muted text-xs italic">No individual votes.</span>'}
                </div>
            </div>`;
        }).join('');
    }

    function renderSessionActions(s) {
        let buttons = `
            <form action="/zeepkist/playlistvoting/dashboard/session/${s.id}/rename" method="post" class="flex gap-1">
                <input type="text" name="name" placeholder="${s.name}" class="bg-steam-mid border border-steam-border rounded px-3 py-1 text-sm text-white w-36 focus:outline-none focus:border-steam-accent"/>
                <button type="submit" class="text-xs bg-steam-border text-white px-3 py-1 rounded hover:brightness-110">Rename</button>
            </form>`;
        if (s.state === 'ACTIVE') {
            buttons += `<form action="/zeepkist/playlistvoting/dashboard/session/${s.id}/state" method="post">
                <input type="hidden" name="state" value="PAUSED"/>
                <button type="submit" class="text-xs bg-yellow-800 text-yellow-300 px-3 py-1 rounded hover:brightness-110">Pause</button></form>`;
        } else if (s.state === 'PAUSED') {
            buttons += `<form action="/zeepkist/playlistvoting/dashboard/session/${s.id}/state" method="post">
                <input type="hidden" name="state" value="ACTIVE"/>
                <button type="submit" class="text-xs bg-green-800 text-green-300 px-3 py-1 rounded hover:brightness-110">Resume</button></form>`;
        }
        if (s.state !== 'FINISHED') {
            buttons += `<form action="/zeepkist/playlistvoting/dashboard/session/${s.id}/state" method="post">
                <input type="hidden" name="state" value="FINISHED"/>
                <button type="submit" class="text-xs bg-gray-700 text-gray-300 px-3 py-1 rounded hover:brightness-110">Finish</button></form>`;
        } else {
            buttons += `<form action="/zeepkist/playlistvoting/dashboard/session/${s.id}/state" method="post">
                <input type="hidden" name="state" value="ACTIVE"/>
                <button type="submit" class="text-xs bg-blue-800 text-blue-300 px-3 py-1 rounded hover:brightness-110">Reopen</button></form>`;
        }
        buttons += `
            <button onclick="openPlaylistModal('${s.id}', '${s.name.replace(/'/g, "\\'")}')"
                    class="text-xs bg-steam-accent text-steam-dark font-semibold px-3 py-1 rounded hover:brightness-110 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                </svg>
                Playlist
            </button>
            <form action="/zeepkist/playlistvoting/dashboard/session/${s.id}/delete" method="post" onsubmit="return confirm('Delete this session?')">
                <button type="submit" class="text-xs bg-red-900 text-red-300 px-3 py-1 rounded hover:brightness-110">Delete</button>
            </form>`;
        return buttons;
    }

    async function fetchLiveData() {
        try {
            const res = await fetch('/zeepkist/playlistvoting/api/dashboard/live');
            if (!res.ok) throw new Error('Not ok');
            const data = await res.json();

            // Current level
            const clBlock = document.getElementById('currentLevelBlock');
            if (data.currentLevel) {
                clBlock.innerHTML = `
                    <span class="text-white text-2xl font-bold">${data.currentLevel.name}</span>
                    <div class="text-steam-muted text-sm mt-1">by <span class="text-steam-accent">${data.currentLevel.author}</span></div>`;
                updateWorkshopEmbed(data.currentLevel);
            } else {
                clBlock.innerHTML = '<span class="text-steam-muted italic text-sm">No level currently set.</span>';
                updateWorkshopEmbed(null);
            }

            // Live votes
            document.getElementById('liveVotesBlock').innerHTML = renderLiveVotes(data.currentVotes);

            // Sessions
            const sessionsEl = document.getElementById('sessionsList');
            if (!data.sessions || data.sessions.length === 0) {
                sessionsEl.innerHTML = '<span class="text-steam-muted italic text-sm">No sessions yet.</span>';
            } else {
                sessionsEl.innerHTML = data.sessions.map(s => `
                    <div class="bg-steam-dark border border-steam-border rounded-lg p-4 flex flex-col gap-3">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="text-white font-medium">${s.name}</span>
                            ${stateBadge(s.state)}
                            <span class="text-xs text-steam-muted">${s.levels.length} levels</span>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            ${renderSessionActions(s)}
                        </div>
                        <div class="flex flex-col gap-1 mt-1">
                            ${renderLevels(s.levels, s.id)}
                        </div>
                    </div>`).join('');
                applyOpenSections();
            }

            document.getElementById('liveIndicator').className = 'inline-block w-2 h-2 rounded-full bg-green-400 animate-pulse';
            document.getElementById('liveLabel').textContent = 'Live';
            document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();

        } catch (e) {
            document.getElementById('liveIndicator').className = 'inline-block w-2 h-2 rounded-full bg-red-500';
            document.getElementById('liveLabel').textContent = 'Offline';
        }
    }

    fetchLiveData();
    pollingInterval = setInterval(fetchLiveData, 3000);
</script>
</body>
</html>
