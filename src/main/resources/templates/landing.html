<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Zeepkist Playlist Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        steam: {dark: '#1b2838', mid: '#16202d', border: '#2a475e', accent: '#66c0f4', muted: '#8f98a0'}
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-steam-dark min-h-screen flex flex-col items-center justify-center font-sans">

<div class="bg-steam-mid border border-steam-border rounded-lg shadow-2xl p-10 w-full max-w-md flex flex-col items-center gap-6">

    <div class="flex flex-col items-center gap-2">
        <h1 class="text-3xl font-bold text-white tracking-tight">Zeepkist</h1>
        <span class="text-xs uppercase tracking-widest text-steam-muted">Playlist Voting</span>
    </div>

    <p class="text-steam-muted text-sm text-center leading-relaxed">
        Manage your Zeepkist playlist voting sessions.<br/>
        Sign in with Steam to get started.
    </p>

    <div class="w-full bg-red-950 border border-red-700 text-red-400 text-sm text-center rounded px-4 py-2"
         th:if="${param.error == 'cancelled'}">
        ⚠ Login was cancelled. Please try again.
    </div>
    <div class="w-full bg-red-950 border border-red-700 text-red-400 text-sm text-center rounded px-4 py-2"
         th:if="${param.error == 'invalid'}">
        ⚠ Login validation failed. Please try again.
    </div>

    <form action="/zeepkist/playlistvoting/auth/steam" method="get">
        <button class="flex items-center gap-3 px-6 py-3 bg-[#171a21] hover:bg-[#2a475e] text-white rounded-md transition-colors duration-200 border border-transparent hover:border-steam-accent group"
                type="submit">
            <svg class="w-6 h-6 fill-current text-white group-hover:text-steam-accent" viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M11.979 0C5.678 0 .511 4.86 0 11.031c.014.001.025.006.04.006.887 0 1.712.212 2.44.583l4.31 6.244c.445.19 1.055.337 1.745.337 2.126 0 3.848-1.564 3.848-3.491 0-.142-.016-.282-.04-.419l5.06-3.606c.46.223.977.351 1.527.351 1.94 0 3.511-1.42 3.511-3.172S20.919 4.7 18.979 4.7c-1.378 0-2.57.717-3.141 1.776L10.74 8.783A3.856 3.856 0 0 0 8.531 8.1c-2.126 0-3.848 1.564-3.848 3.491 0 .142.016.282.04.419L.413 15.616C.147 14.16 0 12.611 0 11.031c0-6.091 4.939-11.03 11.031-11.031h.948zM18.979 6.2c.983 0 1.779.71 1.779 1.586S19.962 9.37 18.979 9.37c-.982 0-1.778-.71-1.778-1.586S17.997 6.2 18.979 6.2zm-10.448 3.484c1.192 0 2.158.87 2.158 1.945 0 1.074-.966 1.945-2.158 1.945-1.193 0-2.159-.871-2.159-1.945 0-1.074.966-1.945 2.159-1.945z"/>
            </svg>
            <span class="font-semibold text-sm">Sign in with Steam</span>
        </button>
    </form>
</div>

<p class="mt-6 text-xs text-steam-border">Zeepkist Playlist Voting · Not affiliated with Valve Corporation</p>
</body>
</html>
