<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Lurk Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark min-h-screen text-white font-sans flex flex-col items-center py-20">

<div class="w-full max-w-2xl px-6">
    <header class="mb-12 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">Available Apps</h1>
        <p class="text-brand-muted">Select a service to continue.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Zeepkist Playlist Voting -->
        <a class="group p-6 bg-brand-card border border-slate-700 rounded-xl hover:border-brand-accent transition-all duration-300 hover:shadow-lg hover:shadow-brand-accent/10"
           href="/zeepkist/playlistvoting/">
            <div class="flex items-center justify-between mb-4">
                <div class="p-3 bg-brand-accent/10 rounded-lg group-hover:bg-brand-accent/20 transition-colors">
                    <svg class="w-6 h-6 text-brand-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                              stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"/>
                    </svg>
                </div>
                <svg class="w-5 h-5 text-brand-muted group-hover:text-brand-accent transform group-hover:translate-x-1 transition-all"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
            </div>
            <h3 class="text-xl font-bold mb-2">Zeepkist Voting</h3>
            <p class="text-sm text-brand-muted leading-relaxed">
                Manage and vote for Zeepkist playlists in real-time.
            </p>
        </a>

        <!-- Other App Example (Future) -->
        <!--
        <div class="p-6 bg-brand-card/50 border border-slate-800 rounded-xl opacity-50 cursor-not-allowed">
            <div class="mb-4">
                <div class="p-3 bg-slate-700/30 w-fit rounded-lg">
                    <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    </svg>
                </div>
            </div>
            <h3 class="text-xl font-bold mb-2 text-slate-400">Coming Soon</h3>
            <p class="text-sm text-slate-500">More services are being developed.</p>
        </div>
        -->
    </div>
</div>

<footer class="mt-auto py-10 text-brand-muted text-xs">
    &copy; 2024 Lurk Project
</footer>
</body>
</html>
