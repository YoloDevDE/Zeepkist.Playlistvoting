<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main-layout :: head('Error - ' + ${status})}"></head>
<body th:replace="~{layout/main-layout :: layout('Error', ~{:: .content-slot}, _)}">

<div class="content-slot w-full max-w-2xl mx-auto py-20">
    <div class="bg-brand-card border border-slate-800 rounded-3xl p-12 text-center shadow-2xl relative overflow-hidden">
        <!-- Background Gimmick -->
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-brand-accent/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-red-500/5 rounded-full blur-3xl"></div>

        <!-- Error Code Icon -->
        <div class="relative mb-8">
            <div class="w-24 h-24 bg-slate-800 rounded-2xl mx-auto flex items-center justify-center border border-slate-700 shadow-inner">
                <span class="text-4xl font-black text-brand-accent" th:text="${status}">500</span>
            </div>
            <div class="absolute -bottom-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs border-4 border-brand-card">
                !
            </div>
        </div>

        <h1 class="text-3xl font-black text-white mb-4 tracking-tight" th:text="${error}">Something went wrong</h1>
        <p class="text-brand-muted mb-10 leading-relaxed text-lg" th:text="${message}">
            The requested page could not be found or an internal server error occurred.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a class="px-8 py-3 bg-brand-accent text-brand-dark font-bold rounded-xl hover:bg-brand-accent/80 transition-all shadow-lg shadow-brand-accent/20"
               href="/">
                Back to Home
            </a>
            <button class="px-8 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition-all border border-slate-700"
                    onclick="window.history.back()">
                Go Back
            </button>
        </div>

        <div class="mt-12 pt-12 border-t border-slate-800/50">
            <p class="text-slate-500 text-sm italic">
                If you believe this is a bug, please contact the administrator.
            </p>
        </div>
    </div>
</div>

</body>
</html>
